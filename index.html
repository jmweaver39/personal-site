<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jay Weaver</title>
  <meta name="description" content="Jay Weaver: projects, research, and how to reach him.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=League+Gothic&display=swap" rel="stylesheet">
  <script>
    /* The opening plays once a visit, and never on the way back from another page.
       The timer shows the home screen anyway if opening.js doesn't arrive */
    (function () {
      var root = document.documentElement;
      var seen = false;
      try {
        seen = sessionStorage.getItem("opening-seen") === "1";
        sessionStorage.setItem("opening-seen", "1");
      } catch (e) {}
      var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var inside = document.referrer.indexOf(location.origin + "/") === 0;
      if (!seen && !still && !inside && location.hash !== "#home") {
        root.dataset.phase = "typing";
        setTimeout(function () {
          if (root.dataset.phase === "typing") delete root.dataset.phase;
        }, 5000);
      }
      /* The rocket hands back with a #home it no longer needs */
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    })();
  </script>
  <script src="wipe.js?v=20261030w"></script>
  <style>
    /* Sizes come from the 2400 x 1800 Figma frames, shown at half size. One --u
       is one Figma pixel; it only shrinks further on screens too small for the
       words. Everything hangs off the middle of the window. */
    :root {
      --u: min(0.5px, (100vw - 48px) / 640, (100svh - 48px) / 900);
      --bg: #000000;
      --fg: #ffffff;
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }

    /* Speckle clouds baked from Figma's shader: one image the browser slides
       across in whole screen pixels */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg div {
      position: absolute;
      top: 0;
      left: 0;
      background: url(images/home/background-strip.png) 0 0 / 100% 100%;
      image-rendering: pixelated;
      will-change: transform;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .page {
      position: fixed;
      inset: 0;
    }

    /* A zero-size anchor at the middle of the window */
    .stage {
      position: absolute;
      left: 50%;
      top: calc(50% - 64 * var(--u));   /* the words and logos together are centred */
      width: 0;
      height: 0;
    }

    /* Closing runs in these timings, opening in the [data-open] ones below */
    .entry {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(600 * var(--u));
      transform: translate(-50%, var(--at));
      transition: transform 0.38s var(--ease) 0.08s, opacity 0.26s linear 0.16s;
    }

    .entry[data-entry="projects"] {
      --at: calc(-176 * var(--u));
    }

    .entry[data-entry="research"] {
      --at: 0px;
    }

    .word,
    .item {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* The mouse counts on a rectangle across the word plus each letter's own
       top and bottom: title-fills.js tests it against that shape */
    .word {
      height: calc(176 * var(--u));
      pointer-events: none;
    }

    .item {
      height: calc(88 * var(--u));
    }

    .word svg,
    .item svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .word text {
      font: 400 200px "League Gothic", Impact, sans-serif;
      letter-spacing: 6px;
      fill: none;
      stroke: var(--fg);
      stroke-width: 2px;
      paint-order: stroke;
    }

    .item text {
      font: 400 44px "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 1px;
      fill: #8f8f8f;
      transition: fill 0.12s linear;
    }

    .item:focus-visible text {
      fill: var(--fg);
    }

    @media (hover: hover) {
      .item:hover text {
        fill: var(--fg);
      }
    }

    /* The shader showing through the letters; title-fills.js sets its box */
    .fill {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* The clicked word's contents, clipped at its bottom edge so they look
       pulled out from under it */
    .drawer {
      position: absolute;
      left: 0;
      top: calc(196 * var(--u));
      width: 100%;
      height: calc(88 * var(--u));
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.3s;
    }

    .slide {
      transform: translateY(-100%);
      transition: transform 0.3s var(--ease);
    }

    .return {
      position: absolute;
      left: 0;
      top: calc(184 * var(--u));
      transform: translate(-50%, calc(-50% + 32 * var(--u)));
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.14s linear, transform 0.14s linear, visibility 0s linear 0.14s, top 0s linear 0.14s;
    }

    /* The 24px Arrow-Back icon, centred in the button, placed as Figma has it */
    .arrow {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 24px;
      height: 24px;
      filter: invert(1);
      transition: opacity 0.15s ease;
    }

    .arrow span {
      position: absolute;
      left: 6.875px;
      top: 4.125px;
      width: 9.75px;
      height: 16px;
      transform: rotate(-90deg) scaleX(-1);
    }

    .arrow img {
      position: absolute;
      left: -0.354px;
      top: -0.5px;
      display: block;
      width: 10.6043px;
      height: 17.0009px;
      max-width: none;
    }

    @media (hover: hover) {
      .return:hover .arrow {
        opacity: 0.6;
      }
    }

    .return:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .links {
      position: absolute;
      left: 0;
      top: calc(256 * var(--u));
      transform: translateX(-50%);
      display: flex;
      gap: calc(22 * var(--u));
      transition: opacity 0.26s linear 0.16s, transform 0.38s var(--ease) 0.08s, visibility 0s linear;
    }

    .links a {
      display: block;
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      outline: none;
    }

    .links a::after {
      content: "";
      position: absolute;
      inset: -6px calc(-11 * var(--u));
    }

    .links a {
      position: relative;
    }

    .icon {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.15s ease;
    }

    .icon img {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
    }

    .icon img.backing {
      left: 4.17%;
      top: 4.17%;
      width: 89.58%;
      height: 89.58%;
    }

    .icon img.tall {
      height: 101.04%;
    }

    @media (hover: hover) {
      .links a:hover .icon {
        opacity: 0.6;
      }
    }

    .links a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: calc(8 * var(--u));
      border-radius: 2px;
    }

    /* Open: the clicked word stays where it is and whatever is under it drops
       a little and fades, as if the page scrolled. Its contents slide out
       beneath it, and return rises last, below them */
    [data-open] .entry:not([data-is-open]) {
      opacity: 0;
      transform: translate(-50%, calc(var(--at) + 96 * var(--u)));
      pointer-events: none;
      transition: transform 0.42s var(--ease), opacity 0.26s linear;
    }

    /* Projects is above Research, so it leaves the other way */
    [data-open="research"] .entry[data-entry="projects"] {
      transform: translate(-50%, calc(var(--at) - 96 * var(--u)));
    }

    [data-open] .links {
      opacity: 0;
      transform: translate(-50%, calc(96 * var(--u)));
      visibility: hidden;
      transition: transform 0.42s var(--ease), opacity 0.26s linear, visibility 0s linear 0.26s;
    }

    [data-open] .entry[data-is-open] .word {
      cursor: default;
      pointer-events: none;
    }

    [data-open] .entry[data-is-open] .drawer {
      visibility: visible;
      transition: visibility 0s linear;
    }

    [data-open] .entry[data-is-open] .slide {
      transform: translateY(0);
      transition: transform 0.42s var(--ease) 0.18s;
    }

    [data-open] .return {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s linear 0.42s, transform 0.3s var(--ease) 0.36s, visibility 0s linear, top 0s linear;
    }

    [data-open="research"] .return {
      top: calc(360 * var(--u));
    }

    /* The opening: the name it types, and the letters and copies it adds */
    #typed {
      position: absolute;
      left: 0;
      top: calc(64 * var(--u));   /* back to the window's exact centre */
      margin: 0;
      transform: translate(-50%, -50%);
      font: 400 25px/1.3 "IBM Plex Mono", ui-monospace, monospace;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }

    #typed .ch {
      display: inline-block;
      white-space: pre;
    }

    [data-phase="typing"] .entry,
    [data-phase="typing"] .links {
      visibility: hidden;
    }

    #layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .entry,
      .slide,
      .links,
      .return,
      .drawer,
      [data-open] .entry:not([data-is-open]),
      [data-open] .entry[data-is-open] .slide,
      [data-open] .links,
      [data-open] .return {
        transition-duration: 0.01s;
        transition-delay: 0s;
      }
    }
  </style>
  <noscript>
    <style>
      .entry { position: static; transform: none; }
      .drawer { position: static; visibility: visible; }
      .slide { transform: none; }
      .word { display: none; }
    </style>
  </noscript>

<body>

  <script>
    const body = document.body;
    const returnEl = document.querySelector(".return");
    const entries = [...document.querySelectorAll(".entry")];
    const links = document.querySelector(".links");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");

    // CSS pixels per Figma pixel
    let u = 0.5;
    function measure() {
      u = links.firstElementChild.offsetWidth / 48 || 0.5;
    }

    // Background: Figma's speckle clouds, baked into one strip two screens wide.
    // It slides across at one slow, steady speed, then back, since the noise
    // doesn't wrap. Each dither cell is a whole number
    // of screen pixels and the strip only moves by whole screen pixels: scaling
    // or sliding it by less made the speckles flicker in Safari.
    const bgStrip = document.querySelector(".bg div");
    const CELLS_W = 2400;
    const CELLS_H = 900;
    const CELL = 2;        // Figma px per dither cell
    const CROSSING = 120000;
    const BG_START = Math.random() * CROSSING * 2;   // each load starts somewhere new
    let bgCell = 1;        // CSS px per dither cell
    let bgLeft = NaN;

    function placeBackground(now) {
      const phase = ((BG_START + (reduce.matches ? 0 : now)) % (CROSSING * 2)) / CROSSING;
      const p = phase < 1 ? phase : 2 - phase;
      const dpr = devicePixelRatio || 1;
      const left = Math.round(-(CELLS_W / 2) * bgCell * (1 - p) * dpr) / dpr;
      if (left !== bgLeft) {
        bgLeft = left;
        bgStrip.style.transform = `translateX(${left}px)`;
      }
    }

    function paintBackground() {
      // A window with no size yet (a hidden tab, say) gets painted on its first resize
      if (!innerWidth || !innerHeight) return;
      const dpr = devicePixelRatio || 1;
      // Big enough to cover the window, half the strip across and all of it down
      const cellPx = Math.max(
        1,
        Math.round(CELL * u * dpr),
        Math.ceil((innerHeight * dpr) / CELLS_H),
        Math.ceil((innerWidth * dpr) / (CELLS_W / 2))
      );
      bgCell = cellPx / dpr;
      bgStrip.style.width = `${CELLS_W * bgCell}px`;
      bgStrip.style.height = `${CELLS_H * bgCell}px`;
      bgLeft = NaN;
    }

    function tick(now) {
      placeBackground(now);
      requestAnimationFrame(tick);
    }

    // The drawers: one open at a time, `return` backs out
    function setOpen(name, byMouse) {
      const was = body.dataset.open;
      document.dispatchEvent(new CustomEvent("fills:clear"));
      if (name) body.dataset.open = name;
      else delete body.dataset.open;
      for (const entry of entries) {
        const is = entry.dataset.entry === name;
        entry.toggleAttribute("data-is-open", is);
        entry.toggleAttribute("inert", !!name && !is);
        const word = entry.querySelector(".word");
        word.setAttribute("aria-expanded", String(is));
        word.tabIndex = is ? -1 : 0;
      }
      links.toggleAttribute("inert", !!name);
      document.dispatchEvent(new CustomEvent("fills:pin", { detail: name }));
      clearTimeout(openTimer);
      if (name) {
        const item = entries.find((e) => e.dataset.entry === name).querySelector(".item");
        item.focus({ preventScroll: true });
        openTimer = setTimeout(() => scramblers.get(item)(), OPEN_AT);
      } else if (was && !byMouse) {
        // Focus lights the word up, so only keyboard users get it back
        entries.find((e) => e.dataset.entry === was).querySelector(".word").focus({ preventScroll: true });
      }
    }

    for (const entry of entries) {
      entry.querySelector(".word").addEventListener("click", () => {
        if (!body.dataset.open) setOpen(entry.dataset.entry);
      });
    }
    returnEl.addEventListener("click", (e) => setOpen(null, e.detail > 0));
    addEventListener("keydown", (e) => {
      if (e.key === "Escape" && body.dataset.open) setOpen(null);
    });

    // Coming back with the browser's back button restores the page as it was left
    addEventListener("pageshow", (e) => {
      if (e.persisted && body.dataset.open) setOpen(null);
    });

    // A drawer row scrambles as it slides out: its letters cycle
    // through random ones and lock back in one by one, left to right. Numbers
    // and symbols hold still.
    const SCRAMBLE = "abcdefghijklmnopqrstuvwxyz";
    const CYCLE = 16;    // ms each character holds
    const STEP = 16;     // ms between letters locking

    const OPEN_AT = 180;   // ms into opening that the row starts to slide
    const HOLD = 260;      // and how long its letters run before locking
    const scramblers = new Map();
    let openTimer = 0;

    for (const item of document.querySelectorAll(".item")) {
      const text = item.querySelector("text");
      const word = text.textContent;
      let raf = 0;
      let drawn = 0;

      const stop = () => {
        cancelAnimationFrame(raf);
        raf = 0;
        text.textContent = word;
      };
      const scramble = () => {
        if (reduce.matches) return;
        stop();
        const start = performance.now();
        drawn = 0;
        const frame = (now) => {
          const t = now - start;
          if (t >= HOLD + word.length * STEP) return stop();
          if (t - drawn >= CYCLE) {
            drawn = t;
            const locked = Math.max(0, Math.floor((t - HOLD) / STEP));
            text.textContent = [...word]
              .map((ch, i) => (i < locked || !/[a-z]/i.test(ch) ? ch : SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)]))
              .join("");
          }
          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
      };

      scramblers.set(item, scramble);
    }

    let repaintTimer = 0;
    addEventListener("resize", () => {
      measure();
      clearTimeout(repaintTimer);
      repaintTimer = setTimeout(paintBackground, 150);
    });

    // Moving to a screen with a different pixel density needs a fresh pattern
    (function watchDensity() {
      matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener(
        "change",
        () => {
          paintBackground();
          watchDensity();
        },
        { once: true }
      );
    })();

    reduce.addEventListener("change", paintBackground);

    measure();
    paintBackground();
    requestAnimationFrame(tick);
  </script>
  <script type="module" src="title-fills.js?v=20261101a"></script>
  <script type="module" src="opening.js?v=20261031c"></script>
  <script src="glitch.js"></script>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jay Weaver</title>
  <meta name="description" content="Jay Weaver: projects, research, and how to reach him.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=League+Gothic&display=swap" rel="stylesheet">
  <script>
    /* The opening plays once a visit, and never on the way back from the rocket */
    (function () {
      var seen = false;
      try {
        seen = sessionStorage.getItem("opening-seen") === "1";
        sessionStorage.setItem("opening-seen", "1");
      } catch (e) {}
      var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.documentElement.dataset.opening = seen || still || location.hash === "#home" ? "skip" : "play";
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    })();
  </script>
  <script src="wipe.js?v=20261030l"></script>
  <style>
    /* Sizes come from the 2400 x 1800 Figma frames, shown at half size. One --u
       is one Figma pixel; it only shrinks further on screens too small for the
       words. Everything hangs off the middle of the window. */
    :root {
      --u: min(0.5px, (100vw - 48px) / 640, (100svh - 48px) / 900);
      --bg: #000000;
      --fg: #ffffff;
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }

    /* Speckle clouds baked from Figma's shader: one image the browser slides
       across in whole screen pixels */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg div {
      position: absolute;
      top: 0;
      left: 0;
      background: url(images/home/background-strip.png) 0 0 / 100% 100%;
      image-rendering: pixelated;
      will-change: transform;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .page {
      position: fixed;
      inset: 0;
    }

    [data-opening="play"] .stage {
      visibility: hidden;
    }

    /* A zero-size anchor at the middle of the window */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
    }

    /* Closing runs in these timings, opening in the [data-open] ones below */
    .entry {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(600 * var(--u));
      transform: translate(-50%, var(--at));
      transition: transform 0.34s var(--ease) 0.06s, opacity 0.18s linear 0.26s;
    }

    .entry[data-entry="projects"] {
      --at: calc(-176 * var(--u));
    }

    .entry[data-entry="research"] {
      --at: 0px;
    }

    .word,
    .item {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .word {
      height: calc(176 * var(--u));
      transition: opacity 0.22s ease;
    }

    .item {
      height: calc(88 * var(--u));
    }

    .word svg,
    .item svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .word text {
      font: 400 200px "League Gothic", Impact, sans-serif;
      letter-spacing: 6px;
      fill: none;
      stroke: var(--fg);
      stroke-width: 2px;
      paint-order: stroke;
    }

    .item text {
      font: 400 44px "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 1px;
      fill: var(--fg);
    }

    /* The shader showing through the letters; title-fills.js sets its box */
    .fill {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .word:focus-visible svg,
    .item:focus-visible svg {
      filter: drop-shadow(0 0 3px #ffffff);
    }

    [data-hover="projects"] .word:not([data-fill="projects"]),
    [data-hover="research"] .word:not([data-fill="research"]) {
      opacity: 0.45;
    }

    /* The clicked word's contents, clipped at its bottom edge so they look
       pulled out from under it */
    .drawer {
      position: absolute;
      left: 0;
      top: calc(196 * var(--u));
      width: 100%;
      height: calc(88 * var(--u));
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.3s;
    }

    .slide {
      transform: translateY(-100%);
      transition: transform 0.3s var(--ease);
    }

    .return {
      position: absolute;
      left: 0;
      top: calc(56 * var(--u));
      transform: translate(-50%, -50%);
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid var(--fg);
      border-radius: 9px;
      background: transparent;
      color: var(--fg);
      font: 400 16px/42px "League Gothic", Impact, sans-serif;
      letter-spacing: 0.8px;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.14s linear, visibility 0s linear 0.14s, background 0.15s ease, color 0.15s ease;
    }

    @media (hover: hover) {
      .return:hover {
        background: var(--fg);
        color: #000000;
      }
    }

    .return:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .links {
      position: absolute;
      left: 0;
      top: calc(256 * var(--u));
      transform: translateX(-50%);
      display: flex;
      gap: calc(22 * var(--u));
      transition: opacity 0.18s linear 0.28s, transform 0.18s linear 0.28s, visibility 0s linear;
    }

    .links a {
      display: block;
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      outline: none;
    }

    .links a::after {
      content: "";
      position: absolute;
      inset: -6px calc(-11 * var(--u));
    }

    .links a {
      position: relative;
    }

    .icon {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.15s ease;
    }

    .icon img {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
    }

    .icon img.backing {
      left: 4.17%;
      top: 4.17%;
      width: 89.58%;
      height: 89.58%;
    }

    .icon img.tall {
      height: 101.04%;
    }

    @media (hover: hover) {
      .links a:hover .icon {
        opacity: 0.6;
      }
    }

    .links a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: calc(8 * var(--u));
      border-radius: 2px;
    }

    /* Open: the other word and the logos go, the clicked word rises, its
       contents slide out, and return comes up last, below them */
    [data-open] .entry {
      transition: transform 0.38s var(--ease) 0.12s, opacity 0.2s linear;
    }

    [data-open] .entry:not([data-is-open]) {
      opacity: 0;
      transform: translate(-50%, calc(var(--at) + 24 * var(--u)));
      pointer-events: none;
    }

    [data-open="projects"] .entry[data-entry="projects"] {
      --at: calc(-304 * var(--u));
    }

    [data-open="research"] .entry[data-entry="research"] {
      --at: calc(-304 * var(--u));
    }

    [data-open] .links {
      opacity: 0;
      transform: translate(-50%, calc(24 * var(--u)));
      visibility: hidden;
      transition: opacity 0.2s linear, transform 0.2s linear, visibility 0s linear 0.2s;
    }

    [data-open] .entry[data-is-open] .word {
      cursor: default;
      pointer-events: none;
    }

    [data-open] .entry[data-is-open] .drawer {
      visibility: visible;
      transition: visibility 0s linear;
    }

    [data-open] .entry[data-is-open] .slide {
      transform: translateY(0);
      transition: transform 0.42s var(--ease) 0.18s;
    }

    [data-open] .return {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s linear 0.42s, visibility 0s linear, background 0.15s ease, color 0.15s ease;
    }

    /* The opening: pieces that only exist while it plays */
    .square,
    .bar,
    .row i {
      position: absolute;
      left: 0;
      background: var(--fg);
      opacity: 0;
      pointer-events: none;
    }

    .square {
      top: 0;
      width: calc(50 * var(--u));
      height: calc(50 * var(--u));
    }

    .bar {
      height: calc(170 * var(--u));
    }

    .row i {
      top: calc(256 * var(--u));
      left: calc(-129 * var(--u) + var(--j) * 70 * var(--u));
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
    }

    @media (prefers-reduced-motion: reduce) {
      .entry,
      .slide,
      .links,
      .return,
      .drawer,
      [data-open] .entry,
      [data-open] .entry[data-is-open] .slide,
      [data-open] .links,
      [data-open] .return {
        transition-duration: 0.01s;
        transition-delay: 0s;
      }
    }
  </style>
  <noscript>
    <style>
      [data-opening] .stage { visibility: visible; }
      .entry { position: static; transform: none; }
      .drawer { position: static; visibility: visible; }
      .slide { transform: none; }
      .word { display: none; }
    </style>
  </noscript>
</head>
<body>
  <h1 class="sr-only">Jay Weaver</h1>

  <div class="bg" aria-hidden="true"><div></div></div>

  <main class="page" data-glitch>

      <div class="square" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"></div>
      <div class="row" aria-hidden="true"><i style="--j: 0"></i><i style="--j: 1"></i><i style="--j: 2"></i><i style="--j: 3"></i></div>
    </div>

  <script>
    const root = document.documentElement;
    const body = document.body;
    const stage = document.querySelector(".stage");
    const returnEl = document.querySelector(".return");
    const entries = [...document.querySelectorAll(".entry")];
    const links = document.querySelector(".links");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const EASE = "cubic-bezier(0.76, 0, 0.24, 1)";

    // CSS pixels per Figma pixel
    let u = 0.5;
    function measure() {
      u = document.querySelector(".square").offsetWidth / 50 || 0.5;
    }

    // Background: Figma's speckle clouds, baked into one strip two screens wide.
    // It slides across once in 40 seconds and back, since the noise doesn't wrap
    // and both ends of the move are at rest. Each dither cell is a whole number
    // of screen pixels and the strip only moves by whole screen pixels: scaling
    // or sliding it by less made the speckles flicker in Safari.
    const bgStrip = document.querySelector(".bg div");
    const CELLS_W = 2400;
    const CELLS_H = 900;
    const CELL = 2;        // Figma px per dither cell
    const CROSSING = 40000;
    let bgCell = 1;        // CSS px per dither cell
    let bgLeft = NaN;

    // Figma's cubic-bezier(0.5, 0, 0.5, 1)
    function bgEase(p) {
      let lo = 0;
      let hi = 1;
      for (let i = 0; i < 18; i++) {
        const s = (lo + hi) / 2;
        if (1.5 * s * (1 - s) + s * s * s < p) lo = s;
        else hi = s;
      }
      const s = (lo + hi) / 2;
      return s * s * (3 - 2 * s);
    }

    function placeBackground(now) {
      const phase = (now % (CROSSING * 2)) / CROSSING;
      const p = reduce.matches ? 0 : phase < 1 ? phase : 2 - phase;
      const dpr = devicePixelRatio || 1;
      const left = Math.round(-(CELLS_W / 2) * bgCell * (1 - bgEase(p)) * dpr) / dpr;
      if (left !== bgLeft) {
        bgLeft = left;
        bgStrip.style.transform = `translateX(${left}px)`;
      }
    }

    function paintBackground() {
      // A window with no size yet (a hidden tab, say) gets painted on its first resize
      if (!innerWidth || !innerHeight) return;
      const dpr = devicePixelRatio || 1;
      // Big enough to cover the window, half the strip across and all of it down
      const cellPx = Math.max(
        1,
        Math.round(CELL * u * dpr),
        Math.ceil((innerHeight * dpr) / CELLS_H),
        Math.ceil((innerWidth * dpr) / (CELLS_W / 2))
      );
      bgCell = cellPx / dpr;
      bgStrip.style.width = `${CELLS_W * bgCell}px`;
      bgStrip.style.height = `${CELLS_H * bgCell}px`;
      bgLeft = NaN;
    }

    function tick(now) {
      placeBackground(now);
      requestAnimationFrame(tick);
    }

    // The drawers: one open at a time, `return` backs out
    function setOpen(name) {
      const was = body.dataset.open;
      document.dispatchEvent(new CustomEvent("fills:clear"));
      if (name) body.dataset.open = name;
      else delete body.dataset.open;
      for (const entry of entries) {
        const is = entry.dataset.entry === name;
        entry.toggleAttribute("data-is-open", is);
        entry.toggleAttribute("inert", !!name && !is);
        const word = entry.querySelector(".word");
        word.setAttribute("aria-expanded", String(is));
        word.tabIndex = is ? -1 : 0;
      }
      links.toggleAttribute("inert", !!name);
      document.dispatchEvent(new CustomEvent("fills:pin", { detail: name }));
      if (name) entries.find((e) => e.dataset.entry === name).querySelector(".item").focus({ preventScroll: true });
      else if (was) entries.find((e) => e.dataset.entry === was).querySelector(".word").focus({ preventScroll: true });
    }

    for (const entry of entries) {
      entry.querySelector(".word").addEventListener("click", () => {
        if (!body.dataset.open) setOpen(entry.dataset.entry);
      });
    }
    returnEl.addEventListener("click", () => setOpen(null));
    addEventListener("keydown", (e) => {
      if (e.key === "Escape" && body.dataset.open) setOpen(null);
    });

    // Coming back with the browser's back button restores the page as it was left
    addEventListener("pageshow", (e) => {
      if (e.persisted && body.dataset.open) setOpen(null);
    });

    // The opening keeps the old square, spin and stretch, then ends on the words:
    // the bar splits in two, each half covers its word and shrinks off it like a
    // fast block cursor, and the logos land last. About two seconds.
    function play() {
      const moves = [];
      const run = (el, frames, options) => {
        const move = el.animate(frames, { easing: EASE, fill: "both", ...options });
        moves.push(move);
        return move;
      };
      const centre = "translate(-50%, -50%)";

      run(document.querySelector(".square"), [
        { opacity: 1, transform: `${centre} rotate(0deg) scale(0)`, offset: 0 },
        { opacity: 1, transform: `${centre} rotate(0deg) scale(1)`, offset: 0.25 },
        { opacity: 1, transform: `${centre} rotate(0deg) scale(1)`, offset: 0.31 },
        { opacity: 1, transform: `${centre} rotate(360deg) scale(6, 0.48)`, offset: 0.99 },
        { opacity: 0, transform: `${centre} rotate(360deg) scale(6, 0.48)`, offset: 1 },
      ], { delay: 200, duration: 800, fill: "forwards" });

      entries.forEach((entry, i) => {
        const svg = entry.querySelector(".word svg");
        const bar = document.querySelectorAll(".bar")[i];
        const text = entry.querySelector(".word text");
        const ink = text.getComputedTextLength() * u;
        const y = (i ? 88 : -88) * u;
        const box = svg.getBoundingClientRect().width;
        const inkLeft = (box - ink) / 2;
        const at = 1250 + i * 90;

        bar.style.width = `${ink + 8}px`;
        run(bar, [
          { opacity: 1, transform: `${centre} translateY(0px) scale(${(300 * u) / ink}, ${24 / 170})` },
          { opacity: 1, transform: `${centre} translateY(${y}px) scale(1, 1)` },
        ], { delay: 1000, duration: 250, fill: "forwards" });
        run(bar, [
          { clipPath: "inset(0 0 0 0)" },
          { clipPath: "inset(0 0 0 100%)" },
        ], { delay: at, duration: 400, fill: "forwards" });
        run(svg, [
          { clipPath: `inset(-40% ${box - inkLeft}px -40% -10px)` },
          { clipPath: "inset(-40% -10px -40% -10px)" },
        ], { delay: at, duration: 400 });
      });

      [...document.querySelectorAll(".row i")].forEach((tile, j) => {
        const at = 1650 + j * 60;
        run(tile, [
          { opacity: 1, transform: `translateY(${-90 * u}px) scale(0.5)` },
          { opacity: 1, transform: "translateY(0) scale(1)", offset: 0.6 },
          { opacity: 0, transform: "translateY(0) scale(0.82)" },
        ], { delay: at, duration: 300, fill: "forwards" });
        run(links.children[j], [
          { opacity: 0, transform: "scale(0.86)" },
          { opacity: 1, transform: "scale(1)" },
        ], { delay: at + 170, duration: 130 });
      });

      root.dataset.opening = "running";
      stage.inert = true;
      Promise.all(moves.map((m) => m.finished))
        .catch(() => {})
        .then(() => {
          moves.forEach((m) => m.cancel());
          stage.inert = false;
          root.dataset.opening = "done";
        });
    }

    let repaintTimer = 0;
    addEventListener("resize", () => {
      measure();
      clearTimeout(repaintTimer);
      repaintTimer = setTimeout(paintBackground, 150);
    });

    // Moving to a screen with a different pixel density needs a fresh pattern
    (function watchDensity() {
      matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener(
        "change",
        () => {
          paintBackground();
          watchDensity();
        },
        { once: true }
      );
    })();

    reduce.addEventListener("change", paintBackground);

    measure();
    paintBackground();
    requestAnimationFrame(tick);

    // The words wait for their font, but not forever
    if (root.dataset.opening === "play") {
      Promise.race([
        document.fonts.load('200px "League Gothic"', "ProjectsResearch"),
        new Promise((resolve) => setTimeout(resolve, 1500)),
      ])
        .catch(() => {})
        .then(play);
    }
  </script>
  <script type="module" src="title-fills.js?v=20261030l"></script>
  <script src="glitch.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jay Weaver</title>
  <meta name="description" content="Jay Weaver on LinkedIn, X, GitHub and email.">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&text=jaymweaver.com&display=swap" rel="stylesheet">
  <style>
    /* Sizes come from the 2400 x 1800 Figma frames, shown at half size. One --u
       is one Figma pixel; it only shrinks further on screens too narrow for the
       name. */
    :root {
      --u: min(0.5px, (100vw - 48px) / 420);
      --bg: #000000;
      --fg: #ffffff;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }

    /* Drifting speckle pattern: a static image made once at the screen's own
       resolution, slid sideways by the browser in whole screen pixels */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg div {
      position: absolute;
      top: 0;
      left: 0;
      background-repeat: repeat-x;
      will-change: transform;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* A zero-size anchor at the middle of the window; everything is centred on it */
    .center {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
    }

    .word,
    .square,
    .row,
    .links {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      transform: translate(-50%, -50%);
    }

    .word {
      font: 400 calc(50 * var(--u)) / 1.3 "IBM Plex Mono", ui-monospace, monospace;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }

    .ch {
      position: relative;
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Each letter turns into a piece of the square as it slides in */
    .ch .b,
    .square,
    .row i {
      background: var(--fg);
    }

    .ch .b {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(50 * var(--u));
      height: calc(50 * var(--u));
      margin: calc(-25 * var(--u)) 0 0 calc(-25 * var(--u));
      opacity: 0;
    }

    .square {
      width: calc(50 * var(--u));
      height: calc(50 * var(--u));
      opacity: 0;
      will-change: transform, opacity;
    }

    .row {
      width: calc(258 * var(--u));
      height: calc(48 * var(--u));
      pointer-events: none;
    }

    .row i {
      position: absolute;
      top: 0;
      left: calc(var(--j) * 70 * var(--u));
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      opacity: 0;
      will-change: transform, opacity;
    }

    .links {
      display: flex;
      gap: calc(22 * var(--u));
    }

    .links a {
      display: block;
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      color: var(--fg);
      opacity: 0;
      outline: none;
      will-change: transform, opacity;
    }

    /* Hidden links can still take keyboard focus (which reveals them), but not clicks */
    .links:not(.live) a {
      pointer-events: none;
    }

    .links svg {
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.15s ease;
    }

    @media (hover: hover) {
      .links a:hover svg {
        opacity: 0.6;
      }
    }

    .links a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: calc(8 * var(--u));
      border-radius: 2px;
    }
  </style>
  <noscript>
    <style>
      .word { display: none; }
      .links:not(.live) a { opacity: 1; pointer-events: auto; }
    </style>
  </noscript>
</head>
<body>
  <h1 class="sr-only">Jay Weaver</h1>

  <div class="bg" aria-hidden="true"><div></div></div>

  <div class="center">
    <p class="word" aria-hidden="true">jaymweaver.com</p>
    <div class="square" aria-hidden="true"></div>
    <div class="row" aria-hidden="true"><i style="--j: 0"></i><i style="--j: 1"></i><i style="--j: 2"></i><i style="--j: 3"></i></div>

    <nav class="links" aria-label="Contact">
      <a href="https://www.linkedin.com/in/jay-weaver2/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
      </a>
      <a href="https://x.com/jmweaver739" target="_blank" rel="noopener noreferrer" aria-label="X" title="X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.4l-5.8-7.58-6.64 7.58H.48l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93Zm-1.29 19.5h2.04L6.48 3.24H4.3l13.31 17.41Z"/></svg>
      </a>
      <a href="https://github.com/jmweaver39" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57L9 21.07c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.83 1.24 1.83 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .31.2.69.82.57A12 12 0 0 0 12 .3"/></svg>
      </a>
      <a href="mailto:jmweaver39@gmail.com" aria-label="Email jmweaver39@gmail.com" title="jmweaver39@gmail.com">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="4" y="9" width="42" height="31" style="fill: var(--bg)"/><path d="M3 11L24 27L45 11M6 8H42C44.6667 8 46 9.33333 46 12V36C46 38.6667 44.6667 40 42 40H6C3.33333 40 2 38.6667 2 36V12C2 9.33333 3.33333 8 6 8Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </nav>
  </div>

  <script>
    const TEXT = "jaymweaver.com";
    const N = TEXT.length;

    // Timing, in milliseconds. Gaps between keystrokes, with a beat before ".com".
    const KEY_GAPS = [0, 70, 65, 80, 65, 60, 75, 70, 55, 70, 120, 75, 65, 70];
    const TYPE_START = 350;
    const HOLD_TEXT = 2000;    // text sits still before collapsing
    const STAGGER = 70;        // between pairs of letters starting to slide
    const TRAVEL = 420;        // one letter's slide into the square
    const POP = 180;           // pause after the last pair lands
    const SETTLE = 150;
    const SPIN = 800;
    const STRETCH_FROM = 0.35; // fraction of the spin before it starts stretching
    const SPLIT = 240;         // bar opening into four tiles
    const REVEAL_DELAY = 110;
    const REVEAL_STAGGER = 60;
    const REVEAL = 260;        // one tile turning into its icon
    const HOLD_LINKS = 3000;   // links sit still before reversing back to the text
    const FAST = 1.5;          // playback speed when the pointer calls up the links

    // Figma geometry, in Figma pixels
    const SQUARE = 50;
    const ICON = 48;
    const PITCH = 70;          // icon width plus the 22px gap
    const ROW = 258;
    const TILE_RADIUS = [3.5, 0, 24, 0]; // LinkedIn corner, X, GitHub circle, mail

    const T = (() => {
      const typeAt = [];
      let at = TYPE_START;
      for (let i = 0; i < N; i++) typeAt.push((at += KEY_GAPS[i]));
      const collapse = typeAt[N - 1] + HOLD_TEXT;
      // Letters leave in mirrored pairs, the two nearest the middle first
      const start = typeAt.map((_, i) => collapse + Math.floor(Math.abs(i - (N - 1) / 2)) * STAGGER);
      const land = start.map((s) => s + TRAVEL);
      const landSorted = [...land].sort((a, b) => a - b);
      // How many letters are in the square once letter i has landed
      const filled = land.map((at) => land.filter((other) => other <= at).length);
      const spin = landSorted[N - 1] + POP + SETTLE;
      const split = spin + SPIN;
      const reveal = split + REVEAL_DELAY;
      const shown = reveal + 3 * REVEAL_STAGGER + REVEAL;
      return { typeAt, collapse, start, land, landSorted, filled, spin, split, reveal, shown };
    })();

    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const lerp = (a, b, k) => a + (b - a) * k;
    const easeIn = (p) => p * p * p;
    const easeOut = (p) => 1 - (1 - p) ** 3;
    const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2);
    const smooth = (a, b, x) => {
      const k = clamp01((x - a) / (b - a));
      return k * k * (3 - 2 * k);
    };
    // Side of the square, as a fraction of its full size, once k letters have landed.
    // Each letter adds the same area.
    const sideAfter = (k) => Math.sqrt(Math.max(0, k) / N);

    const word = document.querySelector(".word");
    const square = document.querySelector(".square");
    const tiles = [...document.querySelectorAll(".row i")];
    const links = document.querySelector(".links");
    const icons = [...links.children];

    word.textContent = "";
    const chars = [...TEXT].map((c) => {
      const ch = document.createElement("span");
      ch.className = "ch";
      const glyph = document.createElement("span");
      glyph.textContent = c;
      const block = document.createElement("span");
      block.className = "b";
      ch.append(glyph, block);
      word.append(ch);
      return { ch, glyph, block, dx: 0 };
    });

    let u = 1; // CSS pixels per Figma pixel

    function measure() {
      u = square.offsetWidth / SQUARE;
      const half = word.offsetWidth / 2;
      for (const c of chars) c.dx = c.ch.offsetLeft + c.ch.offsetWidth / 2 - half;
      rendered = -1;
    }

    function setOpacity(el, v) {
      el.style.opacity = v.toFixed(3);
    }

    let rendered = -1;

    function render(t) {
      if (t === rendered) return;
      rendered = t;

      const landed = T.land.filter((at) => t >= at).length;

      chars.forEach((c, i) => {
        const p = clamp01((t - T.start[i]) / TRAVEL);
        if (t < T.typeAt[i] || p >= 1) {
          setOpacity(c.ch, 0);
          return;
        }
        setOpacity(c.ch, 1);
        const e = p * p;
        // Letters only slide; they never change size
        c.ch.style.transform = `translateX(${(-c.dx * e).toFixed(2)}px)`;
        // Stay a letter for most of the trip and fade into a block near the middle.
        // The block is already the size the square will be once this letter lands.
        setOpacity(c.glyph, 1 - smooth(0.5, 0.9, e));
        setOpacity(c.block, smooth(0.4, 0.8, e));
        c.block.style.transform = `scale(${sideAfter(T.filled[i]).toFixed(4)})`;
      });

      if (landed === 0 || t >= T.split) {
        setOpacity(square, 0);
      } else {
        const side = sideAfter(landed);
        const q = clamp01((t - T.spin) / SPIN);
        const turn = 360 * easeInOut(q);
        const stretch = easeInOut(clamp01((q - STRETCH_FROM) / (1 - STRETCH_FROM)));
        const sx = side * lerp(1, ROW / SQUARE, stretch);
        const sy = side * lerp(1, ICON / SQUARE, stretch);
        square.style.transform = `translate(-50%, -50%) rotate(${turn.toFixed(2)}deg) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
        setOpacity(square, 1);
      }

      // The finished bar breaks into four touching tiles, which slide apart onto
      // the icon slots and then turn into the icons.
      const open = easeOut(clamp01((t - T.split) / SPLIT));

      tiles.forEach((tile, j) => {
        const r = clamp01((t - (T.reveal + j * REVEAL_STAGGER)) / REVEAL);
        const icon = icons[j];
        if (t < T.split) {
          setOpacity(tile, 0);
          setOpacity(icon, 0);
          return;
        }
        const wide = ROW / 4;
        const shift = ((j + 0.5) * wide - (j * PITCH + ICON / 2)) * (1 - open) * u;
        const sx = lerp(wide / ICON, 1, open);
        const shrink = lerp(1, 0.82, easeIn(r));
        tile.style.transform = `translateX(${shift.toFixed(2)}px) scale(${(sx * shrink).toFixed(4)}, ${shrink.toFixed(4)})`;
        tile.style.borderRadius = `${(TILE_RADIUS[j] * smooth(0, 0.6, r) * u).toFixed(2)}px`;
        setOpacity(tile, 1 - smooth(0.15, 1, r));

        icon.style.transform = `scale(${lerp(0.86, 1, easeOut(r)).toFixed(4)})`;
        setOpacity(icon, easeOut(r));
      });

      links.classList.toggle("live", t >= T.reveal);
    }

    // Background: grey speckles scattered with a density that follows soft clouds
    // of noise. The noise wraps horizontally, so the pattern repeats every
    // `period` px and can drift right forever.
    const bgStrip = document.querySelector(".bg div");
    const SPECK = 2.25;  // Figma px per speckle
    const CONTRAST = 0.5; // speckle brightness against black, relative to Figma's #808080
    const GREY = Math.round(0x80 * CONTRAST);
    const DRIFT = 90;    // Figma px per second
    const CLOUD = 420;   // Figma px across one cloud of speckles
    let bgUrl = null;
    let bgDrift = null;
    let bgJob = 0;       // ignores images from a paint that a newer one replaced

    const hash = (x, y, s) => {
      let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };

    // Smooth value noise that repeats every `nx` lattice cells across
    function noise(x, y, nx, s) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const x0 = ((xi % nx) + nx) % nx;
      const x1 = (x0 + 1) % nx;
      const a = hash(x0, yi, s);
      const b = hash(x1, yi, s);
      const c = hash(x0, yi + 1, s);
      const d = hash(x1, yi + 1, s);
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    // The pattern becomes a static image at the screen's resolution, with each
    // speckle a whole number of screen pixels, and the browser slides it one
    // screen pixel at a time. Drawing it live (or letting the browser scale it)
    // made the speckles flicker brighter and darker in Safari.
    function paintBackground() {
      const job = ++bgJob;
      const dpr = devicePixelRatio || 1;
      const speckPx = Math.max(1, Math.round(SPECK * u * dpr));
      const cell = speckPx / dpr;
      const cols = Math.ceil(innerWidth / cell);
      const rows = Math.ceil(innerHeight / cell);
      const period = cols * cell;
      const octaves = [1, 2, 4].map((f, k) => ({
        n: Math.max(1, Math.round((period / (CLOUD * u)) * f)),
        w: [0.6, 0.28, 0.12][k],
        s: k + 1,
      }));

      // One pixel per speckle...
      const small = document.createElement("canvas");
      small.width = cols;
      small.height = rows;
      const sctx = small.getContext("2d");
      const img = sctx.createImageData(cols, rows);
      const data = img.data;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let n = 0;
          for (const o of octaves) n += o.w * noise((x / cols) * o.n, (y / cols) * o.n, o.n, o.s);
          const density = 0.006 + 0.34 * smooth(0.5, 0.85, n) ** 1.5;
          if (hash(x, y, 99) >= density) continue;
          const at = (y * cols + x) * 4;
          data[at] = data[at + 1] = data[at + 2] = GREY;
          data[at + 3] = 0xff;
        }
      }
      sctx.putImageData(img, 0, 0);

      // ...then blown up to whole screen pixels per speckle
      const full = document.createElement("canvas");
      full.width = cols * speckPx;
      full.height = rows * speckPx;
      const fctx = full.getContext("2d");
      fctx.imageSmoothingEnabled = false;
      fctx.drawImage(small, 0, 0, full.width, full.height);

      full.toBlob((blob) => {
        if (job !== bgJob || !blob) return;
        if (bgUrl) URL.revokeObjectURL(bgUrl);
        bgUrl = URL.createObjectURL(blob);
        Object.assign(bgStrip.style, {
          backgroundImage: `url(${bgUrl})`,
          backgroundSize: `${period}px ${rows * cell}px`,
          width: `${period * 2}px`,
          height: `${rows * cell}px`,
        });
        bgDrift?.cancel();
        bgDrift = reduce.matches
          ? null
          : bgStrip.animate(
              [{ transform: `translateX(${-period}px)` }, { transform: "translateX(0)" }],
              {
                duration: (period / (DRIFT * u)) * 1000,
                iterations: Infinity,
                easing: `steps(${Math.round(period * dpr)})`,
              }
            );
      });
    }

    // Playback. The page is a pure function of `t`: the name types once
    // (0 to T.collapse), then `t` swings between the text (T.collapse) and the
    // links (T.shown), pausing at each end. Jumping to the links is just
    // playing fast toward T.shown.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let t = 0;
    let mode = "intro"; // intro, forward, links, backward, text
    let held = 0;       // time spent in the current pause
    let last = 0;
    let near = false;
    let focused = false;
    let tapped = false;
    let tapTimer = 0;
    let ready = false;  // the name waits for its font; the background doesn't

    function tick(now) {
      const dt = last ? Math.min(now - last, 64) : 0;
      last = now;

      if (!ready) {
        requestAnimationFrame(tick);
        return;
      } else if (reduce.matches) {
        t = T.shown;
      } else if (near || focused || tapped) {
        if (t < T.shown) {
          t = Math.min(T.shown, Math.max(t, T.collapse) + dt * FAST);
          mode = "forward";
        } else {
          mode = "links";
          held = 0;
        }
      } else if (mode === "intro" || mode === "forward") {
        t += dt;
        if (mode === "intro" && t >= T.collapse) mode = "forward";
        if (t >= T.shown) {
          t = T.shown;
          mode = "links";
          held = 0;
        }
      } else if (mode === "backward") {
        t -= dt;
        if (t <= T.collapse) {
          t = T.collapse;
          mode = "text";
          held = 0;
        }
      } else {
        held += dt;
        if (mode === "links" && held >= HOLD_LINKS) mode = "backward";
        if (mode === "text" && held >= HOLD_TEXT) mode = "forward";
      }

      render(t);
      requestAnimationFrame(tick);
    }

    // "Close to the centre" is a circle comfortably wider than the icon row
    function nearRadius() {
      return Math.max(220, ROW * u + 100);
    }

    addEventListener(
      "pointermove",
      (e) => {
        if (e.pointerType === "touch") return;
        const d = Math.hypot(e.clientX - innerWidth / 2, e.clientY - innerHeight / 2);
        const r = nearRadius();
        near = near ? d < r * 1.2 : d < r;
      },
      { passive: true }
    );

    document.documentElement.addEventListener("mouseleave", () => {
      near = false;
    });

    // Touch has no hover, so a tap anywhere brings the links up for a while
    addEventListener(
      "pointerdown",
      (e) => {
        if (e.pointerType !== "touch") return;
        tapped = true;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => (tapped = false), 4000);
      },
      { passive: true }
    );

    // Only keyboard focus pins the links; a mouse click focuses links in some browsers too
    links.addEventListener("focusin", (e) => (focused = e.target.matches(":focus-visible")));
    links.addEventListener("focusout", () => (focused = false));

    let repaintTimer = 0;
    addEventListener("resize", () => {
      measure();
      clearTimeout(repaintTimer);
      repaintTimer = setTimeout(paintBackground, 150);
    });

    // Moving to a screen with a different pixel density needs a fresh pattern
    (function watchDensity() {
      matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener(
        "change",
        () => {
          paintBackground();
          watchDensity();
        },
        { once: true }
      );
    })();

    reduce.addEventListener("change", paintBackground);

    measure();
    paintBackground();
    requestAnimationFrame(tick);

    // Measure with the real font, but don't wait forever for it
    Promise.race([
      document.fonts.load(`50px "IBM Plex Mono"`, TEXT),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ])
      .catch(() => {})
      .then(() => {
        measure();
        ready = true;
      });

    document.fonts.ready.then(measure);
  </script>
</body>
</html>

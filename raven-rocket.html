<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raven L-1420 Rocket — Jay Weaver</title>
  <script src="wipe.js?v=20261030w" data-end="index.html?v=20261101a#home"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f1ef;
      --dot: rgba(0, 0, 0, 0.14);
      --fg: #111111;

      --left: clamp(16px, 3.3vw, 80px);
      --top: clamp(12px, 3.83vw, 92px);
      --title-size: clamp(40px, min(9.8vw, 100svh / 6.2), 235px);
      --bar-size: clamp(22px, 2.6vw, 62px);
      --squeeze: 0.72;
      --accent: #ff5a1f;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .track {
      position: relative;
      height: 1977.5vh;
      height: 1977.5svh;
    }

    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
      background-size: 16px 16px;
    }

    .clouds {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
    }
    .clouds canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    canvas.smoke {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* the feed's small print, in the HUD's type, so it
       goes with the video */
    .credit {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      margin: 0;
      opacity: 0;
      pointer-events: none;
      font: 600 9px "SF Mono", Menlo, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }

    /* narrow screens: the HUD panels run the full width, so sit above them */
    @media (max-width: 720px) {
      .credit {
        bottom: 88px;
      }
    }

    .dark {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    canvas.telem {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 150px;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }


    .stage canvas.gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .title {
      position: absolute;
      top: var(--top);
      left: var(--left);
      z-index: 3;
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: var(--title-size);
      line-height: 0.93;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: max(2px, 0.027em) var(--fg);
      transform: scaleX(var(--squeeze));
      transform-origin: left top;
      white-space: nowrap;
    }

    .title a {
      color: inherit;
      text-decoration: none;
    }

    .title--bar {
      font-size: var(--bar-size);
      -webkit-text-stroke: max(1px, 0.02em) var(--fg);
      opacity: 0;
      pointer-events: none;
    }

    .sections {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sec {
      position: absolute;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      max-width: 260px;
    }

    .sec::before {
      content: "";
      display: block;
      width: 1px;
      height: clamp(22px, 4vh, 44px);
      margin: 0 auto 10px;
      background: rgba(17, 17, 17, 0.45);
    }

    .sec .t {
      font-size: clamp(11px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(17, 17, 17, 0.95);
      white-space: nowrap;
    }

    .sec .d {
      margin-top: 3px;
      font-size: clamp(10px, 0.85vw, 12.5px);
      line-height: 1.4;
      color: rgba(17, 17, 17, 0.6);
    }

    /* in the hint's place, coming up once it has gone. They invert against
       whatever is behind them, so they read on the paper, the feed and the Mac */
    .dots {
      position: absolute;
      left: 50%;
      bottom: clamp(14px, 2.2vh, 28px);
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 14px;
      mix-blend-mode: difference;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s linear, visibility 0s 0.3s;
    }

    .dots.shown {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.3s linear 0.3s, visibility 0s 0.3s;
    }

    .dots button {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .dots button.on {
      background: #ffffff;
      border-color: #ffffff;
      transform: scale(1.3);
    }

    /* The way home: the Arrow-Back icon, inverting against what's behind it */
    .back {
      position: absolute;
      left: clamp(4px, 1.1vw, 18px);
      bottom: clamp(4px, 1vh, 14px);
      z-index: 4;
      display: block;
      width: 44px;
      height: 44px;
      mix-blend-mode: difference;
      transition: opacity 0.15s ease;
    }

    @media (hover: hover) {
      .back:hover {
        opacity: 0.6;
      }
    }

    .back:focus-visible {
      outline: 2px solid #ffffff;
      border-radius: 2px;
    }

    .back-icon {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 24px;
      height: 24px;
      filter: invert(1);
    }

    .back-icon span {
      position: absolute;
      left: 6.875px;
      top: 4.125px;
      width: 9.75px;
      height: 16px;
      transform: rotate(-90deg) scaleX(-1);
    }

    .back-icon img {
      position: absolute;
      left: -0.354px;
      top: -0.5px;
      display: block;
      width: 10.6043px;
      height: 17.0009px;
      max-width: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(14px, 2.2vh, 28px);
      z-index: 3;
      transform: translateX(-50%);
      font-size: clamp(10px, 0.8vw, 12px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(17, 17, 17, 0.5);
      transition: opacity 0.3s linear;
    }

    .callouts {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .callouts svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .co {
      position: absolute;
      white-space: nowrap;
      opacity: 0;
    }

    .co .t {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(17, 17, 17, 0.95);
    }

    .co .d {
      margin-top: 2px;
      font: 500 9px ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.08em;
      color: rgba(17, 17, 17, 0.55);
    }

    /* a stop's labels open a card on hover (or a tap, or focus) */
    .co {
      text-align: center;
      outline: none;
    }

    .co.live {
      pointer-events: auto;
      cursor: default;
    }

    .co .t::after {
      content: "+";
      content: "+" / "";
      margin-left: 0.6em;
      color: var(--accent);
    }

    .co.open {
      z-index: 2;
    }

    .co.open .t::after {
      content: "\2013";
      content: "\2013" / "";
    }

    .co .more {
      display: none;
      width: 264px;
      margin: 8px auto 0;
      padding: 10px 12px 11px;
      text-align: left;
      white-space: normal;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(17, 17, 17, 0.78);
      background: var(--bg);
      border: 1px solid rgba(17, 17, 17, 0.28);
      border-top: 2px solid var(--accent);
    }

    .co.open .more {
      display: block;
    }
  </style>
</head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    /* The real RAVEN airframe, split into its three sections (nose + payload
       bay / drogue bay / fin can) along the drogue tube's extent. Scroll
       slides the sections apart along the axis. Model axis: +z toward the
       nose; metres. */
    const GAP = 0.42;
    /* the scroll, in svh, one stretch after another. The holds are the
       stops, where the payload slows to a crawl for its callouts; between
       them it turns a full spin onto its next face. Keep .track's height at
       this total + 100 */
    const HOLD = 60, SPIN = 90;
    const STRETCHES = [
      ["hero", 20],        // assembled
      ["split", 220.5],      // sections slide apart
      ["separated", 71.5],
      ["zoom", 136.5],       // close in on the nose section
      ["nose", 71.5],
      ["reveal", 157.5],     // shells fade, the payload turns to its first face
      ["stop0", HOLD], ["spin1", SPIN],
      ["stop1", HOLD], ["spin2", SPIN],
      ["stop2", HOLD], ["spin3", SPIN],
      ["stop3", HOLD],
      ["dive", 130],         // one sweep down past the payload, into the tube
      ["dark", 56],          // in the tube until the charge fires
      ["feed", 504],         // the filmed separation
    ];
    const SCROLL_SVH = STRETCHES.reduce((s, [, len]) => s + len, 0);
    const PH = {};
    STRETCHES.reduce((at, [name, len]) => {
      PH[name] = [at / SCROLL_SVH, (at + len) / SCROLL_SVH];
      return at + len;
    }, 0);
    const mid = ([a, b]) => (a + b) / 2;
    const HERO_END = PH.split[0], SPLIT_END = PH.split[1];
    const ZOOM0 = PH.zoom[0], ZOOM1 = PH.zoom[1];
    const REV0 = PH.reveal[0], REV1 = PH.reveal[1];
    const DIVE0 = PH.dive[0], DIVE1 = PH.dive[1];
    const SEP0 = PH.feed[0], SEP1 = 1.0;           // slow-motion separation, filmed
    /* the sweep ends GAP into the split stack's lower tube: exactly where
       the lens sits in it once the rocket is closed up, so closing it up
       there changes nothing in view */
    const DIVE = GAP;
    const SEP_GAP = 2.0;                  // metres of slow-mo separation
    const BUMP_ROLL = 0.77;                // rolls the camera pod to the top
    const easeSoft = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const SMOOTH = 0.16;

    const stage = document.querySelector(".stage");
    const canvas = document.querySelector("canvas.gl");
    const hint = document.querySelector(".hint");
    const dotsEl = document.querySelector(".dots");
    const secEls = [...document.querySelectorAll(".sec")];

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.75;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 600);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();
    const key = new THREE.DirectionalLight(0xffffff, 0.5);
    key.position.set(2, 3, 4);
    scene.add(key);
    /* fill from the aft side so the end-on bulkhead view reads true */
    const aftFill = new THREE.DirectionalLight(0xffffff, 1.35);
    aftFill.position.set(4, 0.6, 0.8);
    scene.add(aftFill);
    /* daylight through the opening joint, only during the filmed separation */
    const sepLight = new THREE.DirectionalLight(0xffffff, 0);
    sepLight.position.set(-4, 1.2, 0.6);
    scene.add(sepLight);

    /* seamless carbon-fiber hex weave, generated per pixel */
    const carbonTex = (() => {
      const S = 512, hexS = 30;
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const g = c.getContext("2d");
      const img = g.createImageData(S, S);
      const SQ3 = Math.sqrt(3);
      const hash = (a, b) => {
        let h = (a * 374761393 + b * 668265263) | 0;
        h = ((h ^ (h >> 13)) * 1274126177) | 0;
        return ((h ^ (h >> 16)) >>> 0) / 4294967295;
      };
      for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
          const q = ((2 / 3) * x) / hexS;
          const r = ((-1 / 3) * x + (SQ3 / 3) * y) / hexS;
          let rq = Math.round(q), rr = Math.round(r);
          const rs = Math.round(-q - r);
          const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs + q + r);
          if (dq > dr && dq > ds) rq = -rr - rs;
          else if (dr > ds) rr = -rq - rs;
          const cx = hexS * 1.5 * rq;
          const cy = hexS * SQ3 * (rr + rq / 2);
          const dx = x - cx, dy = y - cy;
          const d = Math.max(Math.abs(dx) * 0.866 + Math.abs(dy) * 0.5, Math.abs(dy));
          const seam = d > hexS * 0.74;
          const h1 = hash(rq, rr);
          const dir = Math.floor(h1 * 3);
          const ang = (dir * Math.PI) / 3;
          const stripe = Math.sin((dx * Math.cos(ang) + dy * Math.sin(ang)) * 0.9) * 0.5 + 0.5;
          let val;
          if (seam) val = 52 + h1 * 8;
          else val = 19 + h1 * 10 + stripe * 17;
          const o = (y * S + x) * 4;
          img.data[o] = val;
          img.data[o + 1] = val + 2;
          img.data[o + 2] = val + 5;
          img.data[o + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 8;
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();
    /* onboard camera backdrop: 323 frames at 480p, one steady tilt from
       straight down, through the horizon, to nearly straight up */
    const cloudsEl = document.querySelector(".clouds");
    const TIP_N = 323;
    const tipSrc = (i) => `images/fr${i}.jpg`;
    /* keep every frame decoded in memory so 30 fps swaps never wait on a load */
    const tipImgs = Array.from({ length: TIP_N }, (_, i) => {
      const im = new Image();
      im.src = tipSrc(i);
      im.decode().catch(() => {});
      return im;
    });
    const feed = cloudsEl.querySelector("canvas").getContext("2d");
    /* OpenRocket export drives the filmed separation: ejection at T+24 s */
    const EJECT_T = 24, FEED_SPAN = 5;
    let fd = null;
    fetch("data/rocket.csv").then((r) => r.text()).then((text) => {
      const t = [], alt = [], vel = [], zen = [], latd = [];
      for (const line of text.split("\n")) {
        if (line.startsWith("#") || !line.trim()) continue;
        const v = line.split(",");
        t.push(+v[0]); alt.push(+v[1]); vel.push(+v[3]); zen.push(+v[19]); latd.push(+v[9]);
      }
      if (t.length) fd = { t, alt, vel, zen, latd };
    }).catch(() => {});
    function fdAt(arr, tt) {
      const T = fd.t;
      let lo = 0, hi = T.length - 1;
      while (hi - lo > 1) { const m2 = (lo + hi) >> 1; T[m2] <= tt ? (lo = m2) : (hi = m2); }
      const a = arr[lo], b = arr[hi];
      if (Number.isNaN(a) || Number.isNaN(b)) return tt - T[lo] < T[hi] - tt ? a : b;
      return a + (b - a) * ((tt - T[lo]) / (T[hi] - T[lo] || 1));
    }
    /* the launch site itself, posed below the camera at the sim's altitude;
       capture spans 6844 x 6417 m, edges smeared outward as haze */
    let groundReady = false;
    const groundTex = new THREE.TextureLoader().load("images/launch-site.jpg", () => {
      groundTex.colorSpace = THREE.SRGBColorSpace;
      groundReady = true;
    });
    const SCN = 1 / 100;                 // scene units per metre of flight data
    const SMEAR = 4;
    groundTex.repeat.set(SMEAR, SMEAR);
    groundTex.offset.set(-(SMEAR - 1) / 2, -(SMEAR - 1) / 2);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(68.44 * SMEAR, 64.17 * SMEAR),
      new THREE.MeshBasicMaterial({ map: groundTex, toneMapped: false })
    );
    ground.rotation.y = -Math.PI / 2;    // face back toward the onboard camera
    ground.visible = false;
    const feedBg = new THREE.Color(0x565c60);
    const feedFog = new THREE.Fog(0xaeb4b8, 25, 80);
    const groundRig = new THREE.Group();
    groundRig.add(ground);
    scene.add(groundRig);
    /* synthetic sky for the pan-up: haze at the horizon, blue-grey above */
    const skyTex = (() => {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, "#5f7d9c");      // zenith
      grad.addColorStop(0.38, "#8fa2b4");
      grad.addColorStop(0.48, "#a7b3bd");
      grad.addColorStop(0.5, "#aeb4b8");    // horizon = fog colour
      grad.addColorStop(1, "#aeb4b8");
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      g.filter = "blur(3px)";
      for (let i = 0; i < 18; i++) {
        g.fillStyle = `rgba(255,255,255,${0.09 + Math.random() * 0.18})`;
        const y = 70 + Math.random() * 52;
        g.beginPath();
        g.ellipse(Math.random() * 256, y, 18 + Math.random() * 40, 3 + Math.random() * 4, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.filter = "none";
      const t2 = new THREE.CanvasTexture(c);
      t2.colorSpace = THREE.SRGBColorSpace;
      return t2;
    })();
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(300, 24, 24),
      new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, toneMapped: false, fog: false })
    );
    sky.rotation.z = Math.PI / 2;         // pole along the rig's real up
    sky.visible = false;
    groundRig.add(sky);
    let tipI = -1;

    const carbonMats = new Set();
    const kraftMats = new Set();
    const acrylicMat = new THREE.MeshStandardMaterial({
      color: 0xdfe6ea, transparent: true, opacity: 0.38,
      roughness: 0.12, metalness: 0.0, depthWrite: false,
    });
    const pineMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setRGB(0.80, 0.62, 0.38), roughness: 0.65, metalness: 0.0,
    });

    /* classic 2x2 twill carbon for the fins */
    const twillTex = (() => {
      const S = 512, cell = 16;
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const g = c.getContext("2d");
      const img = g.createImageData(S, S);
      for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
          const xi = Math.floor(x / cell), yi = Math.floor(y / cell);
          const fx = (x % cell) / cell, fy = (y % cell) / cell;
          const over = (((xi - yi) % 4) + 4) % 4 < 2;
          let val;
          if (over) val = 26 + Math.sin(fx * Math.PI) * 30;
          else val = 18 + Math.sin(fy * Math.PI) * 20;
          const o = (y * S + x) * 4;
          img.data[o] = val;

    const ROPE_W = 0.006, ROPE_T = 0.0012;

      const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");

        nrm.crossVectors(side, tan).normalize();

          p.x + side.x * ROPE_W - nrm.x * ROPE_T, p.y + side.y * ROPE_W - nrm.y * ROPE_T, p.z + side.z * ROPE_W - nrm.z * ROPE_T,
          p.x + side.x * ROPE_W + nrm.x * ROPE_T, p.y + side.y * ROPE_W + nrm.y * ROPE_T, p.z + side.z * ROPE_W + nrm.z * ROPE_T,
          p.x - side.x * ROPE_W + nrm.x * ROPE_T, p.y - side.y * ROPE_W + nrm.y * ROPE_T, p.z - side.z * ROPE_W + nrm.z * ROPE_T

        uv.push(0, v, 1, v, 1, v, 0, v);

        const r = i * 4, s = r + 4;
        for (let k = 0; k < 4; k++) {
          const a = r + k, b = r + ((k + 1) % 4), c2 = s + k, d = s + ((k + 1) % 4);

      g2.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));

       not the blue board's tree. Its PCB, pads, chip and can are colours
       nothing else in the CAD uses */
    const ADC_BOARD = /^(0\.349020_0\.701961_0\.505882|0\.929412_0\.831373_0\.545098|0\.396078_0\.396078_0\.423529|0\.866667_0\.874510_0\.898039)_/;

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    Promise.all([1, 2, 3].map((i) => new Promise((res, rej) =>
      loader.load(`models/rocket_s${i}.glb`, res, undefined, rej)
    ))).then((gltfs) => {
      const HEX_MM = 0.17;    // one texture tile covers 170 mm of surface
      const vtx = new THREE.Vector3();
      const boxes = gltfs.map((g, i) => {
        /* drop the RunCam acrylic windows: they read as white smudges over
           the camera lenses */
        const drop = [];
        g.scene.traverse((o) => { if (/^Acrylic_Runcam_Cover/.test(o.name)) drop.push(o); });
        drop.forEach((o) => o.removeFromParent());
        /* parts the stops call out carry their key in their material name */
        g.scene.traverse((o) => {
          const key = o.isMesh && (o.material.name || "").split("_hl_")[1];
          if (key) o.userData.hl = key;
          else if (o.isMesh && ADC_BOARD.test(o.material.name)) o.userData.hl = "adc";
        });
        restyle(g.scene);
        g.scene.updateMatrixWorld(true);
        /* the CAD mesh has no UVs: wrap the carbon weave cylindrically */
        g.scene.traverse((o) => {
          if (!o.isMesh) return;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          if (i === 0 && mats.some((m) => m && kraftMats.has(m.uuid))) {
            /* the coupler's aft disc face reads as plywood: split the flat
               axial faces near the aft plane out to pine */
            const idx = o.geometry.index;
            const pos = o.geometry.attributes.position;
            const keep = [], disc = [];
            const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
            const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), nrm = new THREE.Vector3();
            for (let tI = 0; tI < idx.count / 3; tI++) {
              const a = idx.getX(tI * 3), b = idx.getX(tI * 3 + 1), cc = idx.getX(tI * 3 + 2);
              A.fromBufferAttribute(pos, a).applyMatrix4(o.matrixWorld);
              B.fromBufferAttribute(pos, b).applyMatrix4(o.matrixWorld);
              C.fromBufferAttribute(pos, cc).applyMatrix4(o.matrixWorld);
              nrm.crossVectors(e1.subVectors(B, A), e2.subVectors(C, A)).normalize();
              const zMean = (A.z + B.z + C.z) / 3;
              if (Math.abs(nrm.z) > 0.6 && zMean < 0.85) disc.push(a, b, cc);
              else keep.push(a, b, cc);
            }
            if (disc.length) {
              const dg = new THREE.BufferGeometry();
              dg.attributes = o.geometry.attributes;
              dg.setIndex(disc);
              const dm = o.clone();
              dm.geometry = dg;
              dm.material = pineMat;
              o.parent.add(dm);
              const kg = new THREE.BufferGeometry();
              kg.attributes = o.geometry.attributes;
              kg.setIndex(keep);
              o.geometry = kg;
            }
            return;
          }
          if (!mats.some((m) => m && carbonMats.has(m.uuid))) return;
          const pos = o.geometry.attributes.position;
          const uv = new Float32Array(pos.count * 2);
          for (let k = 0; k < pos.count; k++) {
            vtx.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld);
            const ang = Math.atan2(vtx.x, vtx.y);
            uv[k * 2] = (ang * 0.0785) / HEX_MM;
            uv[k * 2 + 1] = vtx.z / HEX_MM;
          }
          o.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));

          /* peel fins (twill), the aft retainer (black metal) and the tube
             interiors (Blue Tube) out of the merged airframe mesh by shape */
          {
            const idx = o.geometry.index;
            const triCount = idx.count / 3;
            const finI = [], retI = [], tubeI = [], intI = [], coneI = [], pcbI = [];
            const pA = new THREE.Vector3(), pB = new THREE.Vector3(), pC = new THREE.Vector3();
            for (let tI = 0; tI < triCount; tI++) {
              const a = idx.getX(tI * 3), b = idx.getX(tI * 3 + 1), cc = idx.getX(tI * 3 + 2);
              pA.fromBufferAttribute(pos, a).applyMatrix4(o.matrixWorld);
              pB.fromBufferAttribute(pos, b).applyMatrix4(o.matrixWorld);
              pC.fromBufferAttribute(pos, cc).applyMatrix4(o.matrixWorld);
              const rMax = Math.max(Math.hypot(pA.x, pA.y), Math.hypot(pB.x, pB.y), Math.hypot(pC.x, pC.y));
              const zMax = Math.max(pA.z, pB.z, pC.z);
              const zMean = (pA.z + pB.z + pC.z) / 3;
              if (i === 0 && rMax < 0.042 &&
                  (zMean < 0.912 || (zMean > 0.995 && zMean < 1.07))) pcbI.push(a, b, cc);  // boards, buttons, SD, camera, M9N GPS
              else if (i === 0 && zMean > 1.02) coneI.push(a, b, cc);      // the cone itself: flat black
              else if (i === 2 && zMax < -1.058) retI.push(a, b, cc);
              else if (i === 2 && rMax > 0.075) finI.push(a, b, cc);
              else if (rMax < 0.0505) intI.push(a, b, cc);
              else tubeI.push(a, b, cc);
            }
            if (finI.length || retI.length || intI.length || coneI.length || pcbI.length) {
              const mk = (indices, mat, planarUv) => {
                if (!indices.length) return;
                const geo = new THREE.BufferGeometry();
                geo.attributes = o.geometry.attributes;
                geo.setIndex(indices);
                if (planarUv) {
                  const u2 = new Float32Array(pos.count * 2);
                  for (let k = 0; k < pos.count; k++) {
                    vtx.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld);
                    u2[k * 2] = vtx.z / 0.1;
                    u2[k * 2 + 1] = Math.hypot(vtx.x, vtx.y) / 0.1;
                  }
                  geo.attributes = Object.assign({}, o.geometry.attributes, {
                    uv: new THREE.BufferAttribute(u2, 2),
                  });
                }
                const m2 = o.clone();
                m2.geometry = geo;
                m2.material = mat;
                o.parent.add(m2);
              };
              mk(finI, twillMat, true);
              mk(retI, retainerMat, false);
              mk(intI, blueTubeMat, false);
              mk(coneI, noseMat, false);
              mk(pcbI, pcbMat, false);
              o.geometry = (() => {
                const geo = new THREE.BufferGeometry();
                geo.attributes = o.geometry.attributes;
                geo.setIndex(tubeI);
                return geo;
              })();
            }
          }
        });
        /* measure in model space BEFORE parenting under the rotated rig */
        const b = new THREE.Box3().setFromObject(g.scene);
        secs[i].add(g.scene);
        return b;
      });
      /* the nose cone + outer tube + coupler of section 1 fade away to
         reveal the payload: give those meshes their own transparent mats */
      gltfs[0].scene.traverse((o) => {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const isShell = mats.some((m) => m && (m === noseMat || m === pineMat ||
          m === blueTubeMat || carbonMats.has(m.uuid) || kraftMats.has(m.uuid)));
        if (!isShell) return;
        const cl = (Array.isArray(o.material) ? o.material[0] : o.material).clone();
        cl.transparent = true;
        cl.forceSinglePass = true;
        o.material = cl;
        o.renderOrder = ORDER.shell;
        shellMeshes.push(o);
        shellMats.push(cl);
      });

      /* the payload's parts: the mount plate goes see-through with the
         shells; the panel over the camera side can lift away (both fade to
         wireframe under their own rules); everything else gets materials of
         its group */
      const wireCache = new Map();
      gltfs[0].scene.traverse((o) => {
        if (!o.isMesh || shellMeshes.includes(o)) return;
        const key = o.userData.hl;
        o.userData.group = key && key !== "mount" && key !== "panel" ? key : "rest";
        wireMeshes.push(o);
        if (o.material.transparent) {
          o.userData.glaze = true;
          o.renderOrder = ORDER.glaze;
          if (key !== "panel") glazeMeshes.push(o);
        }
        if (key === "mount" || key === "panel") {
          o.material = o.material.clone();
          o.material.transparent = true;
          o.material.forceSinglePass = true;
          if (key === "mount") {
            mountMats.push(o.material);
            o.renderOrder = ORDER.plate;
          } else {
            o.userData.base = { opacity: o.material.opacity, depthWrite: o.material.depthWrite };
            panelMeshes.push(o);
          }
          return;
        }
        const ck = o.material.uuid + "|" + o.userData.group;
        let m = wireCache.get(ck);
        if (!m) {
          m = o.material.clone();
          m.forceSinglePass = true;
          m.userData.base = { opacity: m.opacity, transparent: m.transparent, depthWrite: m.depthWrite };
          wireCache.set(ck, m);
          (groupMats[o.userData.group] ||= []).push(m);
        }
        o.material = m;
      });

      /* the payload alone: everything in section 1 that stays after the fade */
      const s1 = gltfs[0].scene, s1Parent = s1.parent;
      s1Parent.remove(s1);
      const gpsParts = [];
      s1.traverse((o) => {
        if (o.isMesh && (o.userData.hl === "gps" || GPS_SCREWS.test(o.parent.name))) gpsParts.push(o);
      });
      for (const o of gpsParts) {
        s1.attach(o);                       // the screws sit under the CAD's own frames
        o.applyMatrix4(GPS_SEAT);
      }
      s1.updateMatrixWorld(true);
      const shellSet = new Set(shellMeshes);
      s1.traverse((o) => {
        if (o.isMesh && !shellSet.has(o)) payBox.expandByObject(o);
      });
      const hlBox = {};
      s1.traverse((o) => {
        if (o.isMesh && o.userData.hl && !shellSet.has(o)) {
          (hlBox[o.userData.hl] ||= new THREE.Box3()).expandByObject(o);
        }
      });
      for (const key in hlBox) HL_AT[key] = hlBox[key].getCenter(new THREE.Vector3());
      s1Parent.add(s1);
      payCz = (payBox.min.z + payBox.max.z) / 2;
      payLen = payBox.max.z - payBox.min.z;

      len1 = boxes[0].max.z - boxes[0].min.z;
      const all = boxes[0].clone().union(boxes[1]).union(boxes[2]);
      all.getCenter(C0);
      L0 = all.max.z - all.min.z;
      tubeR = Math.min(all.max.x - all.min.x, all.max.y - all.min.y) / 2 * 0.55;
      cz = boxes.map((b) => (b.min.z + b.max.z) / 2);
      ready = true;
      layout();
      buildEdges();                         // in the background, long before the first stop
    }).catch((e) => console.error("rocket load failed", e));

    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => t * t * (3 - 2 * t);

    /* scroll progress through the sticky track (the section after it
       scrolls past 1) */
    const track = document.querySelector(".track");
    const trackMax = () => track.offsetHeight - window.innerHeight;
    function scrollP() {
      const max = trackMax();
      return max > 0 ? clamp01(window.scrollY / max) : 0;
    }

    let baseDist = 6;
    /* a mesh's CAD edges: the export splits its vertices at creases, so an
       edge that only one triangle uses is a crease or a boundary */
    function featureEdges(geo) {
      const idx = geo.index.array, n = geo.attributes.position.count;
      /* every triangle edge as one number, sorted: an edge that appears
         once in the run is used by one triangle only */
      const keys = new Float64Array(idx.length);
      for (let t = 0; t < idx.length; t += 3) {
        for (let e = 0; e < 3; e++) {
          const a = idx[t + e], b = idx[t + (e + 1) % 3];
          keys[t + e] = a < b ? a * n + b : b * n + a;
        }
      }
      keys.sort();
      const out = new Uint32Array(keys.length * 2);
      let m = 0;
      for (let i = 0; i < keys.length; ) {
        let j = i + 1;
        while (j < keys.length && keys[j] === keys[i]) j++;
        if (j - i === 1) { out[m++] = Math.floor(keys[i] / n); out[m++] = keys[i] % n; }
        i = j;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", geo.attributes.position);
      g.setIndex(new THREE.BufferAttribute(out.slice(0, m), 1));
      return g;
    }
    /* a mesh's curved faces, the ones with an outline to draw: the vertices
       of a flat face all carry one normal, and its edges are lines already */
    function curvedFaces(geo) {
      const idx = geo.index.array, nrm = geo.attributes.normal;
      const same = (a, b) => nrm.getX(a) === nrm.getX(b) && nrm.getY(a) === nrm.getY(b) && nrm.getZ(a) === nrm.getZ(b);
      const out = new Uint32Array(idx.length);
      let m = 0;
      for (let t = 0; t < idx.length; t += 3) {
        const a = idx[t], b = idx[t + 1], c = idx[t + 2];
        if (same(a, b) && same(a, c)) continue;
        out[m++] = a; out[m++] = b; out[m++] = c;
      }
      if (!m) return null;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", geo.attributes.position);
      g.setAttribute("normal", geo.attributes.normal);
      g.setIndex(new THREE.BufferAttribute(out.slice(0, m), 1));
      g.boundingSphere = geo.boundingSphere;
      return g;
    }
    /* a curved body's outline is no edge of its mesh, so the lines lose it:
       a tapered antenna has no crease to draw at all. This draws it on the
       surface instead: N.V falls to 0 where the surface turns away from the
       view, and N.V over its own slope on screen is about the distance to
       that turn in px, so the line keeps its width at any curvature or zoom.
       Both sides of the mesh are drawn, as on a coarse mesh the turn can fall
       on a triangle facing away, but only the side of the turn facing the
       view is inked: the front and back of a body land on the same pixels.
       That one line takes two coats, the weight of the lines around it, as
       featureEdges gives a crease twice, once from each of its sides */
    const outlineMat = () => new THREE.ShaderMaterial({
      uniforms: { color: { value: new THREE.Color(0x1b1c1e) }, opacity: { value: 0 } },
      vertexShader: `
        varying vec3 vN, vV;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vN = normalMatrix * normal;
          vV = -mv.xyz;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 color;
        uniform float opacity;
        varying vec3 vN, vV;
        void main() {
          float d = dot(normalize(vN), normalize(vV));
          float px = d / max(length(vec2(dFdx(d), dFdy(d))), 1e-6);
          float a = opacity * smoothstep(-1.0, 0.0, px) * (1.0 - smoothstep(1.4, 2.6, px));
          if (a < 0.01) discard;
          gl_FragColor = vec4(color, a * (2.0 - a));
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
      extensions: { derivatives: true },
      transparent: true, depthWrite: false, side: THREE.DoubleSide, visible: false,
    });
    function addDepth(o) {
      if (!depthOf.has(o.material)) {
        const d = o.material.clone();
        d.colorWrite = false;
        d.transparent = d.depthWrite = true;
        d.visible = false;
        depthOf.set(o.material, d);
      }
      const copy = new THREE.Mesh(o.geometry, depthOf.get(o.material));
      copy.renderOrder = o.renderOrder - 1;
      o.add(copy);
    }
    /* in slices of a couple of dozen ms, so the page keeps scrolling */
    async function buildEdges() {
      let slice = performance.now();
      const curved = new Map();             // the CAD's parts share their geometry
      shellMeshes.forEach(addDepth);
      for (const o of wireMeshes) {
        const group = o.userData.group;
        edgeMats[group] ||= new THREE.LineBasicMaterial({
          color: 0x1b1c1e, transparent: true, opacity: 0, depthWrite: false, visible: false,
        });
        outlineMats[group] ||= outlineMat();
        const lines = new THREE.LineSegments(featureEdges(o.geometry), edgeMats[group]);
        lines.renderOrder = ORDER.lines;
        o.add(lines);
        if (!curved.has(o.geometry)) curved.set(o.geometry, curvedFaces(o.geometry));
        if (curved.get(o.geometry)) {
          const outline = new THREE.Mesh(curved.get(o.geometry), outlineMats[group]);
          outline.renderOrder = ORDER.lines;
          o.add(outline);
        }
        if (!o.userData.glaze) addDepth(o);
        if (performance.now() - slice > 24) {
          await new Promise((r) => setTimeout(r));
          slice = performance.now();
        }
      }
    }

    function layout() {
      const w = stage.clientWidth, h = stage.clientHeight;
      lastBh = 0;
      lastTick = -1;                       // redraw at the new size
      telem.width = w * 2;
      telem.height = 300;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const hFov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
      baseDist = ((L0 + 2 * GAP) / 2) / Math.tan(hFov / 2) / 0.88;
    }

    let smoothP = scrollP();
    let lastBh = 0;
    let lastTick = -1, lastCamOn = false;
    /* the HUD reads the flight at the frame on screen: frame q is
       T+EJECT_T + q/30 s (the footage is 30 fps). ZEN is the camera's own
       look direction, straight down (180) panning up to 5 deg, exactly the
       tilt the backdrop frames were shot at. Sampled once per frame into a
       table so the readouts and traces are a pure function of the frame */
    const hudZen = (q) => 180 - 175 * q / (TIP_N - 1);
    const hudAlt = (q) => { const t = q / 30; return fd ? fdAt(fd.alt, EJECT_T + t) : Math.max(0, 1420 - 46 * t - 2.45 * t * t); };
    const hudVel = (q) => { const t = q / 30; return fd ? fdAt(fd.vel, EJECT_T + t) : -(46 + 4.9 * t); };
    let hudData = null;
    const hudTable = () => {
      if (!hudData || hudData.fd !== fd) {
        hudData = { fd, alt: [], vel: [], zen: [] };
        for (let k = 0; k < TIP_N; k++) {
          hudData.alt.push(hudAlt(k)); hudData.vel.push(hudVel(k)); hudData.zen.push(hudZen(k));
        }
      }
      return hudData;
    };
    const telem = document.querySelector("canvas.telem");
    const tg = telem.getContext("2d");
    const v = new THREE.Vector3();
    const aim = new THREE.Vector3();
    /* the sweep: a straight line in, a small rounded turn onto the axis,
       a straight line down it */
    const sweepIn = new THREE.LineCurve3(new THREE.Vector3(), new THREE.Vector3());
    const sweepTurn = new THREE.QuadraticBezierCurve3(new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3());
    const sweepDown = new THREE.LineCurve3(new THREE.Vector3(), new THREE.Vector3());
    const sweepPath = new THREE.CurvePath();
    sweepPath.curves.push(sweepIn, sweepTurn, sweepDown);
    const dotEls = [...document.querySelectorAll(".dots button")];
    const DOT_AT = [0, mid(PH.separated), mid(PH.nose), mid(PH.stop0), SEP0];
    const ACT_AT = [PH.split, PH.zoom, PH.reveal, PH.dive].map(mid);
    dotEls.forEach((b, i) => { b.dataset.p = DOT_AT[i]; });
    dotEls.forEach((b) => b.addEventListener("click", () => {
      window.scrollTo({ top: parseFloat(b.dataset.p) * trackMax(), behavior: "smooth" });
    }));

    /* the ejection video is scroll-driven: the frame on screen is always
       the one for the page's position, so it never runs ahead of or behind
       the scroll.
       The scroll isn't shared out evenly: each frame's slice of it is its
       weight, 1 through the plain stretches and up to 2 through the big
       moments (the ejection flash and kick, the horizon rolling through
       the frame, the last of the pan), so even the fastest flick
       slows down for them. FEED_POS[q] is frame q's place in the feed, 0..1.
       It only moves when the page does: there's no autoplay, and native
       scrolling (trackpad momentum included) is never cancelled */
    const feedWeight = (q) => 1
      + 1.0 * (q <= 10 ? 1 : Math.exp(-0.5 * ((q - 10) / 14) ** 2))   // ejection
      + 0.9 * Math.exp(-0.5 * ((q - 160) / 22) ** 2)                  // horizon
      + 0.6 * ease(clamp01((q - 236) / 60));                            // the last of the pan
    const FEED_POS = [0];
    for (let q = 1; q < TIP_N; q++) FEED_POS.push(FEED_POS[q - 1] + feedWeight(q));
    for (let q = 1; q < TIP_N; q++) FEED_POS[q] /= FEED_POS[TIP_N - 1];
    /* the frame for a place u in the feed: the one whose position is nearest */
    const feedFrame = (u) => {
      let lo = 0, hi = TIP_N - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (FEED_POS[mid] <= u) lo = mid; else hi = mid;
      }
      return u - FEED_POS[lo] < FEED_POS[hi] - u ? lo : hi;
    };

    function update() {
      let target = scrollP();
      /* inside the feed the scroll magnetises to the nearest frame step */
      if (target > SEP0 && target < SEP1) {
        const u = (target - SEP0) / (SEP1 - SEP0);
        target = SEP0 + FEED_POS[feedFrame(u)] * (SEP1 - SEP0);
      }
      smoothP += (target - smoothP) * SMOOTH;
      if (Math.abs(target - smoothP) < 0.0004) smoothP = target;

      const act = ACT_AT.filter((a) => smoothP >= a).length;
      dotEls.forEach((b, i) => b.classList.toggle("on", i === act));

      if (!ready) {
        renderer.render(scene, camera);
        return;
      }

      const t = ease(clamp01((smoothP - HERO_END) / (SPLIT_END - HERO_END)));
      const zoomT = easeSoft(clamp01((smoothP - ZOOM0) / (ZOOM1 - ZOOM0)));
      const revT = easeSoft(clamp01((smoothP - REV0) / (REV1 - REV0)));
      const sweep = easeSoft(clamp01((smoothP - DIVE0) / (DIVE1 - DIVE0)));
      const camOn = sweep > 0.995;          // in the tube: the onboard camera takes over
      /* the frame is the page's position in the feed, nothing else */
      const scrollSep = clamp01((target - SEP0) / (SEP1 - SEP0));
      const qStep = camOn ? feedFrame(scrollSep) : 0;
      const sepQ = qStep / (TIP_N - 1);
      const fc = qStep / 30;                // the HUD clock: the frame on screen, 1/30 s apart
      const renderNow = !camOn || qStep !== lastTick || !lastCamOn;
      const groundOn = false;   // Earth-captured tilt frames carry the view

      /* split, then held apart: the lower body stays put while the camera
         flies down to the bottom of the payload and on into its tube. Once
         the view is black the stack is closed up unseen, so the filmed
         separation starts from the assembled rocket */
      const mainGap = camOn ? 0 : GAP * t;
      const kick = 1 - Math.pow(Math.max(0, 1 - qStep / 126), 2);
      const gap = mainGap + SEP_GAP * kick;
      secs[1].position.z = -gap;
      secs[2].position.z = -gap * 2;
      asm.position.set(C0.z - mainGap, -C0.y, -C0.x);
      const tiltK = 1 - zoomT;               // straighten out for the close-up
      rocket.rotation.y = -0.22 * t * tiltK;
      rocket.rotation.x = 0.1 * t * tiltK;
      /* the rest of the rocket holds still while the camera closes in; only
         the pod turns, to the top. Then the payload crawls past each stop's
         face (a full spin and the rest between stops), and the lower stages
         spin gently during the filmed separation */
      const outU = clamp01((smoothP - DIVE0) / CRAWL_OUT);
      const crawled = Math.min(smoothP, DIVE0) + CRAWL_OUT * (outU - outU ** 3 + outU ** 4 / 2);
      let face = (ROLLS[0] + CRAWL * (crawled - mid(PH.stop0))) * revT;
      for (let k = 1; k < ROLLS.length; k++) {
        const [a, b] = PH["spin" + k];
        face += SPUN[k] * easeSoft(clamp01((smoothP - a) / (b - a)));
      }
      secs[0].rotation.z = BUMP_ROLL * zoomT + face;

      secs[1].rotation.z = 1.1 * sepQ;
      secs[2].rotation.z = 1.9 * sepQ;
      /* the backdrop frames pan the camera up 0..80 deg; the separated stack
         keeps hanging toward the real nadir, so it pivots down-frame about
         the onboard camera by exactly the same angle */
      /* constant tilt rate: straight down, through the horizon, to nearly
         straight up at a steady altitude, matching the backdrop frames */
      const panDeg = 175 * qStep / (TIP_N - 1);
      const pan = panDeg * Math.PI / 180;
      const cosA = Math.cos(pan), sinA = Math.sin(pan);
      const CY = 0.012, CZ = 0.655;          // the onboard camera, model space
      const panY = (y, z) => CY + (y - CY) * cosA + (z - CZ) * sinA;
      const panZ = (y, z) => CZ - (y - CY) * sinA + (z - CZ) * cosA;
      secs[1].rotation.x = -pan;
      secs[1].position.set(0, panY(0, -gap), panZ(0, -gap));
      secs[2].rotation.x = -pan;
      secs[2].position.set(0, panY(0, -gap * 2), panZ(0, -gap * 2));

      /* the cord's slack bight starts down in the bay and is pulled out
         to mid-cord as the stage falls away */
      const outT = easeSoft(clamp01(qStep / 36));
      const rideZ = 0.32 - gap;
      const outZ = (0.64 - gap * 0.6) + 0.02;
      const slackY = 0.004 * outT, slackZ = rideZ + (outZ - rideZ) * outT;
      const bx = 0.01 * outT, by = panY(slackY, slackZ), bz = panZ(slackY, slackZ);

      /* the ejection charge: a flash that blows out the sensor for a few
         frames and dies away fast, then a little smoke left hanging as the
         stage drops through it */
      const flashT = camOn && qStep > 0 && qStep < 12 ? Math.exp(-(qStep - 1) / 1.6) : 0;
      const mouthZ = 0.64 - gap;
      flashCore.visible = flashT > 0.01;
      if (flashCore.visible) {
        flashCore.position.set(0, panY(0, mouthZ + 0.01), panZ(0, mouthZ + 0.01));
        const fs = 0.12 + 0.35 * (1 - flashT);
        flashCore.scale.set(fs, fs, 1);
        flashCore.material.opacity = flashT;
      }
      flashLight.intensity = 6 * flashT * flashT;
      flashLight.position.set(0, panY(0, mouthZ + 0.02), panZ(0, mouthZ + 0.02));
      flashEl.style.opacity = (0.8 * flashT).toFixed(3);
      for (const s of smoke) {
        const age = qStep - s.emit;
        s.alpha = 0;
        if (!camOn || age < 0 || age >= SMOKE_LIFE) continue;
        const life = age / SMOKE_LIFE;
        const out = 1 - Math.exp(-age / 14);    // billows out, then hangs
        const kickE = 1 - Math.pow(Math.max(0, 1 - s.emit / 126), 2);
        const z0 = 0.64 - (mainGap + SEP_GAP * kickE);   // the mouth when it vented
        const r = 0.02 + s.reach * out;
        const y = s.dy * r, z = z0 - s.fall * out;
        s.pos.set(s.dx * r, panY(y, z), panZ(y, z));
        s.size = 0.06 + 0.24 * Math.sqrt(out) + 0.1 * life;    // across, m
        s.alpha = 0.38 * Math.min(1, age / 3) * (1 - life) * (1 - life);
      }

      /* the shock cord pays out past the lens as the stage falls away */
      rope.visible = camOn && qStep > 0;
      if (rope.visible) {
        /* the departing stage's mouth, carried through the same pan */
        const my = panY(0, 0.64 - gap);
        const mz = panZ(0, 0.64 - gap);
        /* past 40 deg of pan the cord stops chasing the lens and swings
           out of frame with the rest of the hanging stack */
        const rel = Math.max(0, pan - 40 * Math.PI / 180);
        const cR = Math.cos(rel), sR = Math.sin(rel);
        const relY = (y, z) => CY + (y - CY) * cR + (z - CZ) * sR;
        const relZ = (y, z) => CZ - (y - CY) * sR + (z - CZ) * cR;
        const a0y = relY(-0.060, 0.630), a0z = relZ(-0.060, 0.630);
        const a1y = relY(-0.042, 0.614), a1z = relZ(-0.042, 0.614);
        const pts = [
          new THREE.Vector3(0.010, a0y, a0z),
          new THREE.Vector3(0.006, a1y, a1z),
          new THREE.Vector3(0.006 + (bx - 0.006) * 0.45, a1y + (by - a1y) * 0.45 - 0.012, a1z + (bz - a1z) * 0.45),
          new THREE.Vector3(bx + 0.002, by - 0.003, bz),
          new THREE.Vector3(bx * 0.5 + 0.002, (by + my) * 0.5 - 0.012, (bz + mz) * 0.5),
          new THREE.Vector3(0.004, my, mz),
        ];
        rope.geometry.dispose();
        rope.geometry = ropeGeo(pts);
      }

      /* each stop's callouts come in as it arrives and go before the next
         spin; the panel over the camera side lifts away as that face comes
         round and is back once the sweep is under way */
      const stopVis = STOPS.map((_, k) => {
        const [a, b] = PH["stop" + k], len = b - a;
        return ease(clamp01((smoothP - a) / (0.3 * len))) *
          (1 - ease(clamp01((smoothP - (b - 0.2 * len)) / (0.2 * len))));
      });
      const [s3a, s3b] = PH.spin3;
      const lift = ease(clamp01((smoothP - (s3a + s3b) / 2) / ((s3b - s3a) / 2))) *
        (1 - ease(clamp01((smoothP - DIVE0) / (0.3 * (DIVE1 - DIVE0)))));
      /* at a stop its parts stay as they are and the rest of the payload
         goes to wireframe; with a card open, only that card's part stays */
      let stopK = -1, stopV = 0;
      stopVis.forEach((sv, k) => { if (sv > stopV) { stopV = sv; stopK = k; } });
      const opened = coItems.find((c) => c.hover && c.k === stopK);
      const solid = new Set((opened ? [opened] : coItems.filter((c) => c.k === stopK)).flatMap((c) => c.keys));
      const wireOf = (group) => (solid.has(group) ? 0 : stopV);
      for (const group in groupMats) {
        const w = wireOf(group);
        for (const m of groupMats[group]) {
          const b = m.userData.base;
          m.opacity = b.opacity * (1 - w);
          /* the shader's alpha hangs on this: it's fixed at 1 in an opaque
             material, however low the opacity */
          const clear = b.transparent || w > 0.001;
          if (m.transparent !== clear) {
            m.transparent = clear;
            m.needsUpdate = true;
          }
          m.depthWrite = b.depthWrite && w < 0.01;
          m.visible = w < 0.999;
          fadeDepth(m, 1 - w);
        }
      }
      for (const group in edgeMats) {
        const w = wireOf(group);
        edgeMats[group].opacity = 0.42 * w;
        edgeMats[group].visible = w > 0.001;
      }
      for (const o of glazeMeshes) o.renderOrder = wireOf(o.userData.group) ? ORDER.glaze : ORDER.stays;
      /* the outlines fade with their group's lines, exactly */
      for (const group in outlineMats) {
        outlineMats[group].uniforms.opacity.value = edgeMats[group].opacity;
        outlineMats[group].visible = edgeMats[group].visible;
      }
      const wireRest = wireOf("rest");
      for (const o of panelMeshes) {
        o.material.opacity = o.userData.base.opacity * (1 - lift) * (1 - wireRest);
        o.material.depthWrite = o.userData.base.depthWrite && lift < 0.02 && wireRest < 0.01;
        o.visible = lift < 0.999;
        fadeDepth(o.material, (1 - lift) * (1 - wireRest));
      }

      /* nose cone + outer tube fade away to reveal the payload */
      const fade = clamp01(revT * 1.7);
      for (let k = 0; k < shellMats.length; k++) {
        shellMats[k].opacity = 1 - fade;
        shellMeshes[k].visible = fade < 0.999;
        fadeDepth(shellMats[k], 1 - fade);
      }
      /* the plate is one layer too: 0.44 of it reads as its two walls at 0.25 */
      for (const m of mountMats) {
        m.opacity = (1 - 0.5625 * fade) * (1 - wireRest);
        m.depthWrite = fade < 0.02;
        fadeDepth(m, m.opacity);
      }

      /* camera: wide -> nose close-up -> onboard camera POV (locked) */
      const noseX = asm.position.x - cz[0];
      const payX = asm.position.x - payCz;
      const tx = (noseX + (payX - noseX) * revT) * zoomT;
      const vHalf = Math.tan(THREE.MathUtils.degToRad(32) / 2);
      const hFov2 = 2 * Math.atan(vHalf * camera.aspect);
      const dWide = baseDist * (0.82 + 0.18 * t);
      const dNose = (len1 / 2) / Math.tan(hFov2 / 2) / 0.72;
      /* revealed payload framed like the Figma frame (1722x894): it spans
         92% of the width, its axis sitting 2.7% of the height below centre */
      const dPay = (payLen / 2) / Math.tan(hFov2 / 2) / 0.92;
      let dist = dWide + (dNose - dWide) * zoomT;
      dist += (dPay - dist) * revT;
      const yOff = 0.027 * 2 * dPay * vHalf * revT;
      const camY = 0.045 * zoomT * (1 - revT) + yOff;
      /* then one sweep: a straight line in to the middle of the payload's
         bottom, where the onboard camera sits (coming in below the payload),
         a small rounded turn onto the axis there, and straight on down the
         axis into the lower tube.
         Its aim slides from the payload to the middle of the tube's mouth,
         then keeps a little ahead down the axis, so the tube stays centred
         all the way in. One curve, no stop */
      const lens = asm.position.x - 0.655, povY = 0.012, povZ = 0.015;
      let turnW = 0, depth = 0;
      if (camOn) {
        turnW = depth = 1;
        camera.position.set(lens, povY, povZ);
        camera.lookAt(lens + 1, povY, povZ);
      } else if (sweep > 0) {
        const BEND = 0.06;                     // m: radius of the turn onto the axis
        aim.set(lens, povY, povZ);
        sweepIn.v1.set(tx, camY, dist);
        sweepIn.v2.copy(sweepIn.v1).sub(aim).setLength(BEND).add(aim);
        sweepTurn.v0.copy(sweepIn.v2);
        sweepTurn.v1.copy(aim);
        sweepTurn.v2.set(lens + BEND, povY, povZ);
        sweepDown.v1.copy(sweepTurn.v2);
        sweepDown.v2.set(lens + DIVE, povY, povZ);
        for (const c of sweepPath.curves) c.updateArcLengths();
        sweepPath.updateArcLengths();
        sweepPath.getPointAt(sweep, camera.position);
        turnW = easeSoft(clamp01(sweep / 0.55));
        depth = clamp01((camera.position.x - lens) / DIVE);
        const mouth = lens + DIVE - (0.813 - 0.655);
        aim.set(Math.max(mouth, camera.position.x + 0.15), povY, povZ);
        v.set(tx, yOff, 0).lerp(aim, turnW);
        camera.lookAt(v);
      } else {
        camera.position.set(tx, camY, dist);
        camera.lookAt(tx, yOff, 0);
      }
      camera.fov = 32 + 30 * turnW;
      camera.updateProjectionMatrix();

      /* ground at the sim's exact AGL altitude and hang angle */
      scene.background = groundOn ? feedBg : null;
      scene.fog = groundOn ? feedFog : null;
      ground.visible = groundOn;
      sky.visible = groundOn;
      if (groundOn) {
        const mQ = EJECT_T + sepQ * FEED_SPAN;
        const th = (90 - fdAt(fd.zen, mQ)) * Math.PI / 180;
        const altS = Math.max(50, fdAt(fd.alt, mQ) * 0.3048) * SCN;
        const dLat = (fdAt(fd.latd, mQ) - fdAt(fd.latd, EJECT_T)) * 0.3048 * SCN;
        groundRig.position.set(lens, povY, povZ);
        groundRig.rotation.z = -th;          // true vertical swings screen-down
        ground.position.set(altS, 0, dLat);  // image centre = nadir at real AGL
      }

      /* the bore is dark; the filmed separation is black-and-white */
      renderer.toneMappingExposure = 0.75 - 0.56 * ease(depth) + 0.22 * sepQ + 2.5 * flashT;
      /* dark, not black, from the tube's mouth until the charge fires */
      darkEl.style.opacity = (0.6 * (camOn ? (qStep === 0 ? 1 : 0) : ease(clamp01((depth - 0.45) / 0.55)))).toFixed(3);
      sepLight.intensity = 2.4 * sepQ;
      const film = camOn ? `grayscale(1) contrast(1.18) brightness(${(1 + 1.2 * flashT).toFixed(3)})`
        : depth > 0 ? `grayscale(${depth.toFixed(3)})` : "";
      canvas.style.filter = film;
      cloudsEl.style.filter = film;
      smokeEl.style.filter = film;
      cloudsEl.style.opacity = camOn && !groundOn ? "1" : "0";

      /* paint the already-decoded frame straight onto the feed canvas: no
         fetch and no decode, so every step lands on its refresh */
      const tipImg = tipImgs[qStep];
      if (!groundOn && qStep !== tipI && tipImg.complete && tipImg.naturalWidth) {
        tipI = qStep;
        feed.drawImage(tipImg, 0, 0, 640, 480);
      }

      /* lattice-style telemetry strip, time-driven, camera view only */
      telem.style.opacity = camOn ? "1" : "0";
      creditEl.style.opacity = camOn ? "1" : "0";
      if (camOn) {
        const hd = hudTable();
        const alt = hd.alt[qStep], vel = hd.vel[qStep], rr = hd.zen[qStep];

        const W = telem.width / 2, H = 150;
        tg.setTransform(2, 0, 0, 2, 0, 0);
        tg.clearRect(0, 0, W, H);
        tg.font = '600 9px "SF Mono", Menlo, monospace';

        const panel = (x, y, w2, h2) => {
          tg.fillStyle = "rgba(8,10,9,0.55)";
          tg.fillRect(x, y, w2, h2);
          tg.strokeStyle = "rgba(255,255,255,0.28)";
          tg.lineWidth = 1;
          tg.strokeRect(x + 0.5, y + 0.5, w2 - 1, h2 - 1);
        };
        const label = (s, x, y, dim) => {
          tg.fillStyle = dim ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.88)";
          tg.fillText(s, x, y);
        };
        const graph = (x, y, w2, h2, series, name, val) => {
          panel(x, y, w2, h2);
          label(name, x + 6, y + 13, true);
          label(val, x + w2 - 6 - tg.measureText(val).width, y + 13, false);
          /* the trace runs from the first frame to this one, on a fixed
             scale over the whole clip so it never rescales as it grows */
          let mn = Infinity, mx = -Infinity;
          for (const d of series) { if (d < mn) mn = d; if (d > mx) mx = d; }
          const rg = mx - mn || 1;
          tg.strokeStyle = "rgba(255,255,255,0.85)";
          tg.beginPath();
          for (let k = 0; k <= qStep; k++) {
            const gx = x + 6 + (k / (TIP_N - 1)) * (w2 - 12);
            const gy = y + h2 - 6 - ((series[k] - mn) / rg) * (h2 - 26);
            k ? tg.lineTo(gx, gy) : tg.moveTo(gx, gy);
          }
          tg.stroke();
        };

        const m = 10, ph = 70, py = H - ph - 10;
        panel(m, py, 148, ph);
        label("RAVEN L-1420 • CAM 01", m + 7, py + 14, false);
        label("T+ " + (EJECT_T + fc).toFixed(1).padStart(5, "0") + " S", m + 7, py + 29, false);
        label("GS-1  640×480  918 MHZ", m + 7, py + 44, true);
        const sep = qStep > 0;
        tg.fillStyle = sep ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.5)";   // monochrome feed
        tg.fillText("SEP: " + (sep ? "CONFIRMED" : "ARMED"), m + 7, py + 59);
        graph(m + 154, py, 92, ph, hd.alt, "ALT FT", alt.toFixed(0));
        graph(m + 252, py, 92, ph, hd.vel, "VEL MPH", vel.toFixed(1));
        graph(m + 350, py, 92, ph, hd.zen, "ZEN °", rr.toFixed(1));
      }

      /* the stops' callouts: leaders from each part to its label, the
         parts lit with them (fully while their card is open) */
      if (stopVis.some((s) => s > 0.01)) {
        rocket.updateMatrixWorld(true);
        camera.updateMatrixWorld();
      }
      const cw = stage.clientWidth, ch = stage.clientHeight;
      const placed = [];
      for (const c of coItems) {
        const vis = stopVis[c.k];
        const anchors = c.at ? [c.at] : c.keys.map((key) => HL_AT[key]).filter(Boolean);
        const on = vis > 0.01 && anchors.length > 0;
        c.el.style.opacity = on ? vis.toFixed(3) : "0";
        const live = on && vis > 0.6;
        if (live !== c.live) {
          c.live = live;
          c.el.classList.toggle("live", live);
          c.el.tabIndex = live ? 0 : -1;
          if (live) c.el.removeAttribute("aria-hidden");
          else c.el.setAttribute("aria-hidden", "true");
          if (!live && c.hover) c.open(false);
        }
        if (!on) {
          for (const g of c.legs) g.pl.style.opacity = g.dot.style.opacity = "0";
          continue;
        }
        const pts = anchors.map((p) => {
          v.copy(p).applyMatrix4(secs[0].matrixWorld).project(camera);
          return [(v.x * 0.5 + 0.5) * cw, (-v.y * 0.5 + 0.5) * ch];
        });
        const bx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
        const by = c.dy < 0 ? Math.min(...pts.map((p) => p[1])) : Math.max(...pts.map((p) => p[1]));
        const half = c.el.offsetWidth / 2;
        const lx = Math.min(Math.max(bx + c.dx, half + 12), cw - half - 52);
        const ly = Math.min(Math.max(by + c.dy, 40), ch - 40);
        const lh = c.el.offsetHeight;
        if (!c.hover) { c.closedH = lh; c.closedHalf = half; }
        const h = c.closedH || lh, up = c.dy < 0;
        /* y: where the closed label's top sits */
        placed.push({ c, pts, vis, lx, lh, h, half: c.closedHalf || half, up, y: up ? ly - 6 - h : ly + 6 });
      }
      /* labels that would overlap (on narrow screens) are pushed apart, away
         from the payload, nearest first; an open card counts as its label */
      for (const up of [true, false]) {
        const side = placed.filter((p) => p.up === up).sort((p, q) => (up ? q.y - p.y : p.y - q.y));
        side.forEach((p, i) => {
          for (let j = 0; j < i; j++) {
            const q = side[j];
            if (Math.abs(p.lx - q.lx) >= p.half + q.half + 8) continue;
            p.y = up ? Math.min(p.y, q.y - 6 - p.h) : Math.max(p.y, q.y + q.h + 6);
          }
        });
      }
      for (const p of placed) {
        const { c, pts, vis, lx, lh } = p;
        /* an open card grows away from its leader, and keeps on screen even
           if that means covering things */
        const top = Math.min(Math.max(p.up ? p.y + p.h - lh : p.y, 8), ch - lh - 8);
        const ly = p.up ? top + lh + 6 : top - 6;      // the leaders end at the label
        c.legs.forEach((g, i) => {
          if (!pts[i]) { g.pl.style.opacity = g.dot.style.opacity = "0"; return; }
          const [px, py] = pts[i];
          g.pl.setAttribute("x1", px.toFixed(1)); g.pl.setAttribute("y1", py.toFixed(1));
          g.pl.setAttribute("x2", lx.toFixed(1)); g.pl.setAttribute("y2", ly.toFixed(1));
          g.dot.setAttribute("cx", px.toFixed(1)); g.dot.setAttribute("cy", py.toFixed(1));
          g.pl.style.opacity = g.dot.style.opacity = vis.toFixed(3);
        });
        c.el.style.left = lx + "px";
        c.el.style.top = top + "px";
        c.el.style.transform = "translate(-50%, 0)";
      }

      hint.style.opacity = String(smoothP < 0.01 ? 1 : 0);
      dotsEl.classList.toggle("shown", smoothP >= 0.01);

      /* labels under each section */
      const w = stage.clientWidth, h = stage.clientHeight;
      const offs = [0, -gap, -gap * 2];
      secEls.forEach((el, i) => {
        v.set(asm.position.x - (cz[i] + offs[i]), -tubeR * 2.4, 0)
          .applyQuaternion(rocket.quaternion);
        v.project(camera);
        el.style.left = ((v.x * 0.5 + 0.5) * w) + "px";
        el.style.top = ((-v.y * 0.5 + 0.5) * h) + "px";
        el.style.opacity = clamp01((t - 0.35 - i * 0.18) / 0.2) * (1 - clamp01(zoomT * 2));
      });

      if (renderNow) {
        /* 480p feed while the onboard camera is live */
        const prFull = Math.min(window.devicePixelRatio, 2);
        const bhFull = Math.round(h * prFull);
        const bh = camOn ? 480 : bhFull;
        if (bh !== lastBh) {
          lastBh = bh;
          renderer.setPixelRatio(1);
          renderer.setSize(Math.round(bh * (w / h)), bh, false);
        }
        renderer.render(scene, camera);
        drawSmoke(w, h);
        lastTick = qStep;
        lastCamOn = camOn;
      }
    }

    function tick() {
      update();
      requestAnimationFrame(tick);
    }

    window.addEventListener("resize", layout);
    layout();
    tick();
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raven L-1420 Telemetry — Jay Weaver</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --dim: rgba(17, 17, 17, 0.45);
      --hair: rgba(17, 17, 17, 0.14);
      --accent: #0019ff;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px 48px;
    }

    a.back {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
    }
    a.back:hover { color: var(--ink); }

    header.top {
      display: flex;
      align-items: baseline;
      gap: 18px;
      flex-wrap: wrap;
      margin: 14px 0 10px;
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .title span { color: var(--dim); font-weight: 400; }

    .tplus {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 500;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .tplus small { font-size: 12px; color: var(--dim); }

    /* ---- controls ---- */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      padding: 10px 0;
    }

    button.play {
      font: 600 10px system-ui, sans-serif;
      letter-spacing: 0.14em;
      width: 64px;
      padding: 7px 0;
      background: var(--ink);
      color: #fff;
      border: 1px solid var(--ink);
      cursor: pointer;
    }
    button.play:hover { background: #333; }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: rgba(17, 17, 17, 0.25);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 20px;
      background: var(--ink);
      cursor: ew-resize;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 20px; background: var(--ink);
      border: none; border-radius: 0; cursor: ew-resize;
    }

    .tbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--dim);
    }
    input.tin {
      width: 84px;
      font: 500 13px var(--mono);
      padding: 5px 7px;
      border: 1px solid rgba(17, 17, 17, 0.35);
      background: #fff;
      color: var(--ink);
    }
    input.tin:focus { outline: none; border-color: var(--ink); }

    .events {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 0 0;
    }
    .events button {
      font: 500 9px system-ui, sans-serif;
      letter-spacing: 0.12em;
      padding: 4px 8px;
      background: #fff;
      border: 1px solid rgba(17, 17, 17, 0.3);
      color: rgba(17, 17, 17, 0.7);
      cursor: pointer;
    }
    .events button:hover { border-color: var(--ink); color: var(--ink); }
    .events button b { font-weight: 600; color: var(--ink); }

    /* ---- panels ---- */
    .grid {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 14px;
      margin-top: 16px;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      border: 1px solid var(--hair);
      padding: 10px 12px 12px;
      background: #fff;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .panel canvas { display: block; width: 100%; }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      align-content: start;
    }

    /* ---- readout table ---- */
    .readout {
      margin-top: 14px;
      border: 1px solid var(--hair);
      padding: 12px;
    }
    .readout h2 {
      margin: 0 0 10px;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim);
    }
    .rgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1px;
      background: var(--hair);
      border: 1px solid var(--hair);
    }
    .cell { background: #fff; padding: 7px 9px 8px; }
    .cell .k {
      font-size: 8.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell .v {
      font: 500 13px var(--mono);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .cell .v small { font-size: 9px; color: var(--dim); margin-left: 3px; }

    .loading {
      margin: 60px 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="projects.html" data-glitch-link>&larr; Projects</a>

    <header class="top">
      <div class="title">Raven L-1420 <span>/ Simulated flight telemetry &middot; OpenRocket sim 3</span></div>
      <div class="tplus">T+ <span id="tval">0.00</span><small> S</small></div>
    </header>

    <div class="controls">
      <button class="play" id="play">PLAY</button>
      <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
      <div class="tbox">T =
        <input class="tin" id="tin" type="number" min="0" step="0.1" value="0"> S
      </div>
    </div>
    <div class="events" id="events"></div>

    <div class="loading" id="loading">Loading flight data&hellip;</div>

    <div id="main" style="display:none">
      <div class="grid">
        <div class="panel">
          <h2>Trajectory &mdash; altitude vs lateral distance (ft)</h2>
          <canvas id="traj"></canvas>
        </div>
        <div class="charts" id="charts"></div>
      </div>

      <div class="readout">
        <h2>All channels at T</h2>
        <div class="rgrid" id="rgrid"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    let cols = [], units = [], rows = [], times = [], events = [], tMax = 1;
    let t = 0, playing = false;

    /* ---------- parse the OpenRocket export ---------- */
    async function load() {
      let text;
      try {
        const res = await fetch("data/rocket.csv");
        if (!res.ok) throw new Error(res.status);
        text = await res.text();
      } catch (e) {
        $("#loading").textContent = "data/rocket.csv not found — copy the sim export there and reload.";
        return;
      }
      const evRe = /^# Event (\w+) occurred at t=([\d.]+)/;
      let deployN = 0;
      const seen = new Set();
      for (const line of text.split("\n")) {
        if (line.startsWith("#")) {
          if (line.startsWith("# Time (s)")) {
            cols = line.slice(2).split(",").map((c) => c.trim());
            units = cols.map((c) => {
              const m = c.match(/\(([^()]*)\)\s*$/);
              return m ? m[1].replace(/​/g, "") : "";
            });
            cols = cols.map((c) => c.replace(/\s*\([^()]*\)\s*$/, ""));
          } else {
            const m = line.match(evRe);
            if (m && m[1] !== "SIM_WARN") {
              let name = m[1];
              if (name === "RECOVERY_DEVICE_DEPLOYMENT") name = ++deployN === 1 ? "DROGUE" : "MAIN";
              const key = name + m[2];
              if (!seen.has(key)) {
                seen.add(key);
                events.push({ name, t: parseFloat(m[2]) });
              }
            }
          }
          continue;
        }
        if (!line.trim()) continue;
        const vals = line.split(",").map(parseFloat);
        if (vals.length === cols.length) {
          rows.push(vals);
          times.push(vals[0]);
        }
      }
      tMax = times[times.length - 1];
      init();
    }

    /* value of column i at time tt, linearly interpolated */
    function at(i, tt) {
      let lo = 0, hi = times.length - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        times[mid] <= tt ? (lo = mid) : (hi = mid);
      }
      const a = rows[lo][i], b = rows[hi][i];
      if (Number.isNaN(a) || Number.isNaN(b)) return tt - times[lo] < times[hi] - tt ? a : b;
      const f = (tt - times[lo]) / (times[hi] - times[lo] || 1);
      return a + (b - a) * f;
    }
    const colIdx = (name) => cols.indexOf(name);

    /* ---------- formatting ---------- */
    function fmt(v) {
      if (v === undefined || Number.isNaN(v)) return "—";
      const av = Math.abs(v);
      if (av !== 0 && (av >= 100000 || av < 0.001)) return v.toExponential(2);
      if (av >= 1000) return v.toFixed(0);
      if (av >= 10) return v.toFixed(1);
      return v.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") || "0";
    }

    /* ---------- canvases ---------- */
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    function sizeCanvas(cv, w, h) {
      cv.width = Math.round(w * DPR);
      cv.height = Math.round(h * DPR);
      cv.style.height = h + "px";
      const g = cv.getContext("2d");
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      return g;
    }

    /* nice tick step: 1/2/5 x 10^n so axes read as scale bars */
    function tickStep(range, target) {
      const raw = range / target;
      const p = Math.pow(10, Math.floor(Math.log10(raw)));
      for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
      return 10 * p;
    }

    const CHARTS = [
      "Altitude", "Vertical velocity", "Total velocity",
      "Vertical acceleration", "Total acceleration", "Roll rate",
      "Pitch rate", "Vertical orientation (zenith)", "Lateral distance",
      "Thrust", "Drag force", "Mach number",
    ];
    const chartObjs = [];
    let trajG, trajW, trajH, iAlt, iLat, iZen;

    function init() {
      $("#loading").style.display = "none";
      $("#main").style.display = "";
      $("#slider").max = tMax;
      $("#tin").max = tMax.toFixed(2);

      /* event chips */
      $("#events").innerHTML = events
        .map((e, i) => `<button data-t="${e.t}">${e.name} <b>${e.t.toFixed(1)}s</b></button>`)
        .join("");
      $("#events").addEventListener("click", (ev) => {
        const b = ev.target.closest("button");
        if (b) setT(parseFloat(b.dataset.t), true);
      });

      iAlt = colIdx("Altitude");
      iLat = colIdx("Lateral distance");
      iZen = colIdx("Vertical orientation (zenith)");

      /* trajectory canvas */
      const tp = $("#traj");
      trajW = tp.parentElement.clientWidth - 24;
      trajH = Math.round(trajW * 0.92);
      trajG = sizeCanvas(tp, trajW, trajH);

      /* chart canvases */
      const host = $("#charts");
      for (const name of CHARTS) {
        const i = colIdx(name);
        if (i < 0) continue;
        const div = document.createElement("div");
        div.className = "panel";
        div.innerHTML = `<h2>${name} <span style="float:right;color:var(--accent)" class="cv"></span></h2><canvas></canvas>`;
        host.appendChild(div);
        const w = div.clientWidth - 24, h = 104;
        const g = sizeCanvas(div.querySelector("canvas"), w, h);
        let mn = Infinity, mx = -Infinity;
        for (const r of rows) {
          const v = r[i];
          if (!Number.isNaN(v)) { if (v < mn) mn = v; if (v > mx) mx = v; }
        }
        if (mn === mx) { mn -= 1; mx += 1; }
        chartObjs.push({ i, g, w, h, mn, mx, unit: units[i], vEl: div.querySelector(".cv") });
      }

      /* readout cells */
      $("#rgrid").innerHTML = cols
        .map((c, i) => `<div class="cell"><div class="k" title="${c}">${c}</div><div class="v"><span id="rv${i}"></span><small>${units[i]}</small></div></div>`)
        .join("");

      requestAnimationFrame(tick);
    }

    /* ---------- drawing ---------- */
    function drawTraj() {
      const g = trajG, W = trajW, H = trajH;
      g.clearRect(0, 0, W, H);
      const pad = { l: 46, r: 14, t: 10, b: 30 };
      let xMax = 0, yMax = 0;
      for (const r of rows) {
        if (r[iLat] > xMax) xMax = r[iLat];
        if (r[iAlt] > yMax) yMax = r[iAlt];
      }
      xMax = Math.max(xMax * 1.08, 100);
      yMax = yMax * 1.06;
      const sx = (v) => pad.l + (v / xMax) * (W - pad.l - pad.r);
      const sy = (v) => H - pad.b - (v / yMax) * (H - pad.t - pad.b);

      /* axes + ticks (the scale bars) */
      g.strokeStyle = "rgba(17,17,17,0.5)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(pad.l + 0.5, pad.t); g.lineTo(pad.l + 0.5, H - pad.b + 0.5);
      g.lineTo(W - pad.r, H - pad.b + 0.5);
      g.stroke();
      g.fillStyle = "rgba(17,17,17,0.55)";
      g.font = "9px " + getComputedStyle(document.body).getPropertyValue("--mono");
      const xs = tickStep(xMax, 6), ys = tickStep(yMax, 7);
      g.textAlign = "center";
      for (let v = 0; v <= xMax; v += xs) {
        const x = sx(v);
        g.strokeStyle = "rgba(17,17,17,0.08)";
        g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, H - pad.b); g.stroke();
        g.strokeStyle = "rgba(17,17,17,0.5)";
        g.beginPath(); g.moveTo(x, H - pad.b); g.lineTo(x, H - pad.b + 4); g.stroke();
        g.fillText(fmt(v), x, H - pad.b + 15);
      }
      g.textAlign = "right";
      for (let v = 0; v <= yMax; v += ys) {
        const y = sy(v);
        g.strokeStyle = "rgba(17,17,17,0.08)";
        g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke();
        g.strokeStyle = "rgba(17,17,17,0.5)";
        g.beginPath(); g.moveTo(pad.l - 4, y); g.lineTo(pad.l, y); g.stroke();
        g.fillText(fmt(v), pad.l - 7, y + 3);
      }
      g.textAlign = "left";
      g.fillText("LATERAL FT", W - pad.r - 58, H - pad.b - 6);
      g.save();
      g.translate(pad.l + 10, pad.t + 8);
      g.rotate(-Math.PI / 2); g.textAlign = "right";
      g.fillText("ALT FT", 0, 0);
      g.restore();

      /* full path, light */
      g.strokeStyle = "rgba(17,17,17,0.18)";
      g.lineWidth = 1;
      g.beginPath();
      for (let k = 0; k < rows.length; k++) {
        const x = sx(rows[k][iLat]), y = sy(rows[k][iAlt]);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();

      /* flown portion, ink */
      g.strokeStyle = "#111";
      g.lineWidth = 1.6;
      g.beginPath();
      let lastX = sx(0), lastY = sy(0);
      for (let k = 0; k < rows.length && times[k] <= t; k++) {
        lastX = sx(rows[k][iLat]); lastY = sy(rows[k][iAlt]);
        k ? g.lineTo(lastX, lastY) : g.moveTo(lastX, lastY);
      }
      g.stroke();

      /* current position + attitude tick */
      const cx = sx(at(iLat, t)), cy = sy(at(iAlt, t));
      const zen = at(iZen, t);
      g.strokeStyle = "#0019ff";
      g.lineWidth = 2;
      if (!Number.isNaN(zen)) {
        const a = (90 - zen) * Math.PI / 180;   /* 90 = straight up */
        g.beginPath();
        g.moveTo(cx - Math.sin(a) * 9, cy + Math.cos(a) * 9);
        g.lineTo(cx + Math.sin(a) * 9, cy - Math.cos(a) * 9);
        g.stroke();
      }
      g.fillStyle = "#0019ff";
      g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();
    }

    function drawCharts() {
      for (const c of chartObjs) {
        const { i, g, w, h, mn, mx } = c;
        g.clearRect(0, 0, w, h);
        const pad = { l: 6, r: 6, t: 4, b: 12 };
        const sx = (tt) => pad.l + (tt / tMax) * (w - pad.l - pad.r);
        const sy = (v) => pad.t + (1 - (v - mn) / (mx - mn)) * (h - pad.t - pad.b);
        /* min/max rails */
        g.strokeStyle = "rgba(17,17,17,0.1)";
        g.lineWidth = 1;
        g.strokeRect(pad.l + 0.5, pad.t + 0.5, w - pad.l - pad.r - 1, h - pad.t - pad.b - 1);
        g.fillStyle = "rgba(17,17,17,0.45)";
        g.font = "8px " + getComputedStyle(document.body).getPropertyValue("--mono");
        g.textAlign = "left";
        g.fillText(fmt(mx), pad.l + 3, pad.t + 9);
        g.fillText(fmt(mn), pad.l + 3, h - pad.b - 3);
        /* curve */
        g.strokeStyle = "rgba(17,17,17,0.8)";
        g.beginPath();
        let started = false;
        for (let k = 0; k < rows.length; k++) {
          const v = rows[k][i];
          if (Number.isNaN(v)) { started = false; continue; }
          const x = sx(times[k]), y = sy(v);
          started ? g.lineTo(x, y) : g.moveTo(x, y);
          started = true;
        }
        g.stroke();
        /* cursor */
        const x = sx(t);
        g.strokeStyle = "#0019ff";
        g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, h - pad.b); g.stroke();
        const v = at(i, t);
        if (!Number.isNaN(v)) {
          g.fillStyle = "#0019ff";
          g.beginPath(); g.arc(x, sy(clamp(v, mn, mx)), 2.4, 0, Math.PI * 2); g.fill();
        }
        c.vEl.textContent = fmt(v) + (c.unit ? " " + c.unit : "");
      }
    }

    function drawReadout() {
      for (let i = 0; i < cols.length; i++) {
        const el = document.getElementById("rv" + i);
        if (el) el.textContent = fmt(i === 0 ? t : at(i, t));
      }
    }

    /* ---------- time control ---------- */
    function setT(v, fromJump) {
      t = clamp(v, 0, tMax);
      $("#slider").value = t;
      $("#tval").textContent = t.toFixed(2);
      if (fromJump || document.activeElement !== $("#tin")) $("#tin").value = t.toFixed(2);
    }
    $("#slider").addEventListener("input", (e) => { playing = false; syncPlay(); setT(parseFloat(e.target.value)); });
    $("#tin").addEventListener("input", (e) => {
      const v = parseFloat(e.target.value);
      if (!Number.isNaN(v)) { playing = false; syncPlay(); setT(v); }
    });
    function syncPlay() { $("#play").textContent = playing ? "PAUSE" : "PLAY"; }
    $("#play").addEventListener("click", () => {
      if (!playing && t >= tMax - 0.01) setT(0, true);
      playing = !playing;
      syncPlay();
    });

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (playing) {
        setT(t + dt, true);
        if (t >= tMax) { playing = false; syncPlay(); }
      }
      drawTraj();
      drawCharts();
      drawReadout();
      requestAnimationFrame(tick);
    }

    load();
  </script>
</body>
</html>

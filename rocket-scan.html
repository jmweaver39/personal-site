<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section Scan — Jay Weaver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111111;
      --dot: rgba(255, 255, 255, 0.08);
      --fg: #ffffff;
      --dim: rgba(255, 255, 255, 0.6);
      --faint: rgba(255, 255, 255, 0.25);
      --left: clamp(16px, 3.3vw, 80px);
      --top: clamp(12px, 3.83vw, 92px);
      --bar-size: clamp(26px, 3vw, 72px);
      --squeeze: 0.72;
      /* slice panel side; the locator beside it is 420:1600 at the same height */
      --s: min(68svh, 640px, calc((100vw - 2 * var(--left) - 46px) / 1.2625));
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
      background-size: 16px 16px;
      color: var(--fg);
      font-family: system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: calc(var(--top) + var(--bar-size)) var(--left) var(--top);
    }

    .title {
      position: absolute;
      top: var(--top);
      left: var(--left);
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: var(--bar-size);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: max(1px, 0.02em) var(--fg);
      transform: scaleX(var(--squeeze));
      transform-origin: left top;
      white-space: nowrap;
    }

    .title a {
      color: inherit;
      text-decoration: none;
    }

    /* the scan box: hover (or focus, or tap) steps the cut up the rocket */
    .scan {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 10px;
      margin: 0;
      padding: 12px 12px 10px;
      border: 1px solid var(--faint);
      background: rgba(17, 17, 17, 0.6);
      cursor: crosshair;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .scan:hover,
    .scan:focus-visible,
    .scan.on {
      border-color: rgba(255, 255, 255, 0.85);
    }

    .scan header,
    .scan footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .scan header b {
      font-weight: 600;
      color: var(--fg);
    }

    .views {
      display: flex;
      gap: 10px;
    }

    .views canvas {
      display: block;
      height: var(--s);
    }

    /* where on the rocket the cut is, like a scan's scout image */
    canvas.locator {
      width: calc(var(--s) * 420 / 1600);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      padding-right: 10px;
      box-sizing: content-box;
    }

    canvas.slice {
      width: var(--s);
    }

    .scan .hint {
      transition: opacity 0.2s ease;
    }

    .scan:hover .hint,
    .scan.on .hint {
      opacity: 0;
    }
  </style>
</head>
<body>
  <main class="page" data-glitch>
    <h1 class="title"><a href="projects.html" data-glitch-link aria-label="Section Scan — back to projects">Section&nbsp;Scan</a></h1>

    <figure class="scan" tabindex="0" role="img" aria-label="Raven L-1420 section scan: top-down cuts from tail to nose">
      <header>
        <b>Raven L-1420</b>
        <span>Axial section · top down</span>
      </header>
      <div class="views">
        <canvas class="locator"></canvas>
        <canvas class="slice"></canvas>
      </div>
      <footer>
        <span class="sta">STA 0000 mm</span>
        <span class="hint">Hover to scan</span>
        <span class="num">01 / 50</span>
      </footer>
    </figure>
  </main>

  <script>
    (() => {
      /* 50 cuts through the full 2454 mm stack from tools/scan-capture.html:
         axialN looks straight down on cut N, scanN shows where it is */
      const N = 50, FPS = 20, LENGTH = 2454;
      const box = document.querySelector(".scan");
      const locator = box.querySelector("canvas.locator");
      const slice = box.querySelector("canvas.slice");
      const staEl = box.querySelector(".sta");
      const numEl = box.querySelector(".num");

      const load = (name) => Array.from({ length: N }, (_, i) => {
        const im = new Image();
        im.src = `images/scan/${name}${i}.webp`;
        im.decode().then(() => i === shown && draw(), () => {});
        return im;
      });
      const slices = load("axial");
      const scouts = load("scan");

      let shown = 0, target = 0, last = 0;

      function paint(canvas, im) {
        const w = Math.round(canvas.clientWidth * devicePixelRatio);
        const h = Math.round(canvas.clientHeight * devicePixelRatio);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        const g = canvas.getContext("2d");
        g.clearRect(0, 0, w, h);
        if (im.complete && im.naturalWidth) g.drawImage(im, 0, 0, w, h);
      }

      function draw() {
        paint(slice, slices[shown]);
        paint(locator, scouts[shown]);
        /* the cut runs from 10 mm under the tail to 10 mm over the nose */
        const sta = Math.min(LENGTH, Math.max(0, -10 + (LENGTH + 20) * shown / (N - 1)));
        staEl.textContent = `STA ${String(Math.round(sta)).padStart(4, "0")} mm`;
        numEl.textContent = `${String(shown + 1).padStart(2, "0")} / ${N}`;
      }

      /* step one cut at a time toward the target at FPS: up while you're
         over the box, back down when you leave */
      function tick(now) {
        if (shown !== target && now - last >= 1000 / FPS - 2) {
          shown += Math.sign(target - shown);
          last = now;
          draw();
        }
        requestAnimationFrame(tick);
      }

      const up = () => (target = N - 1);
      const down = () => (target = 0);
      box.addEventListener("pointerenter", (e) => e.pointerType !== "touch" && up());
      box.addEventListener("pointerleave", (e) => e.pointerType !== "touch" && down());
      box.addEventListener("focus", up);
      box.addEventListener("blur", down);
      /* touch has no hover: a tap toggles the scan */
      box.addEventListener("pointerup", (e) => {
        if (e.pointerType !== "touch") return;
        box.classList.toggle("on");
        box.classList.contains("on") ? up() : down();
      });

      window.addEventListener("resize", draw);
      draw();
      requestAnimationFrame(tick);
    })();
  </script>
  <script src="glitch.js"></script>
</body>
</html>
